<title>AutoEdit Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* AutoEdit Studio (claude.ai Artifact). Dark-first, JUICT red. Data comes only from the Artifact db, written by the
   Studio session on Timon's PC; every PC button sends one comment to that session (webapp/studio.py format). */
:root {
  --bg: #0d0e11; --panel: #15171c; --panel2: #1b1e25; --line: #262a33; --line2: #3a404c; --text: #e9eaee; --muted: #8b90a0;
  --accent: #e70002; --accent2: #ff3b3f; --on-accent: #ffffff; --ok: #2fbf71; --warn: #f0b429; --fail: #ff5c5c; --blue: #4c8dff;
  --ok-line: #1f5a3c; --warn-line: #5c4a1b; --fail-line: #6a2a2a; --blue-line: #233f73; --shadow: rgba(0,0,0,.45);
  --r: 12px; color-scheme: dark; --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f4f4f6; --panel: #ffffff; --panel2: #f0f1f4; --line: #dfe1e6; --line2: #c5c9d2; --text: #15171c; --muted: #5d6272;
  --accent: #e70002; --accent2: #c40002; --ok: #16804a; --warn: #9a6a00; --fail: #c62828; --blue: #2459c9;
  --ok-line: #9fd3b6; --warn-line: #e3c98a; --fail-line: #efb0b0; --blue-line: #a9c1ef; --shadow: rgba(20,22,28,.15);
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f4f4f6; --panel: #ffffff; --panel2: #f0f1f4; --line: #dfe1e6; --line2: #c5c9d2; --text: #15171c; --muted: #5d6272;
  --accent: #e70002; --accent2: #c40002; --ok: #16804a; --warn: #9a6a00; --fail: #c62828; --blue: #2459c9;
  --ok-line: #9fd3b6; --warn-line: #e3c98a; --fail-line: #efb0b0; --blue-line: #a9c1ef; --shadow: rgba(20,22,28,.15);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); }
a { color: inherit; text-decoration: none; }
h1 { font-size: 26px; margin: 0; letter-spacing: -.02em; line-height: 1.2; text-wrap: balance; overflow-wrap: anywhere; }
h2 { font-size: 16px; margin: 0 0 12px; letter-spacing: -.01em; }
.muted { color: var(--muted); } .small { font-size: 12px; } .mono { font-family: var(--mono); }
.spacer { flex: 1; }

.shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 12px; position: sticky; top: 0;
  height: 100vh; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 16px; padding: 4px 8px; }
.logo { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); position: relative; flex: none; }
.logo::after { content: ""; position: absolute; left: 9px; top: 7px; border-left: 10px solid #fff;
  border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
nav { display: flex; flex-direction: column; gap: 2px; }
nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; color: var(--muted); }
nav a i { font-style: normal; width: 18px; text-align: center; }
nav a:hover { background: var(--panel2); color: var(--text); }
nav a.on { background: var(--panel2); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
nav em { margin-left: auto; font-style: normal; background: var(--accent); color: var(--on-accent); font-size: 11px;
  border-radius: 10px; padding: 0 7px; }
.side-status { margin-top: auto; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; background: var(--muted); flex: none; }
.dot.on { background: var(--ok); } .dot.off { background: var(--fail); } .dot.busy { background: var(--warn); }

main { padding-block: 28px 80px; padding-left: max(34px, env(safe-area-inset-left, 0px));
  padding-right: max(34px, env(safe-area-inset-right, 0px)); max-width: 1400px; width: 100%; min-width: 0; }
.head { display: flex; align-items: flex-end; gap: 12px 16px; margin-bottom: 18px; flex-wrap: wrap; }
.crumb { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.crumb a:hover { color: var(--text); }
.loading { color: var(--muted); padding: 40px 0; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.grid { display: grid; gap: 16px; }
.grid > *, .stack > * { min-width: 0; }
.cols-grade { grid-template-columns: minmax(0, 1fr) minmax(280px, 340px); align-items: start; }
.cols-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }

.projects { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.pcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden;
  transition: transform .12s, border-color .12s; display: flex; flex-direction: column; min-width: 0; }
.pcard:hover { transform: translateY(-2px); border-color: var(--line2); }
.pcard .img { aspect-ratio: 16/9; background: var(--panel2); display: grid; place-items: center; color: var(--line2);
  font-size: 30px; overflow: hidden; }
.pcard .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pcard .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.pcard .name { font-weight: 600; overflow-wrap: anywhere; }

.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 20px; font-size: 11px;
  background: var(--panel2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; }
.tag.ok { color: var(--ok); border-color: var(--ok-line); } .tag.warn { color: var(--warn); border-color: var(--warn-line); }
.tag.fail { color: var(--fail); border-color: var(--fail-line); } .tag.blue { color: var(--blue); border-color: var(--blue-line); }
.tag.red { color: #fff; background: var(--accent); border-color: var(--accent); }

label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); }
input[type=text] { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 10px; font: inherit; width: 100%; min-width: 0; }
input[type=text]:focus { outline: none; border-color: var(--blue); }
input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }

button { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 9px; padding: 9px 15px; font: inherit;
  font-weight: 600; cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled) { background: var(--accent2); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); font-weight: 500; }
button.ghost:hover:not(:disabled) { background: var(--panel2); }
button.dark { background: var(--panel2); border: 1px solid var(--line); color: var(--text); font-weight: 500; }
button.dark:hover:not(:disabled) { border-color: var(--line2); background: var(--panel2); }
button.sm { padding: 4px 10px; font-size: 12px; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto;
  scrollbar-width: none; }
.tabs a { padding: 9px 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a.on { color: var(--text); border-color: var(--accent); }
.tabs a:hover { color: var(--text); }
[hidden] { display: none !important; }

/* steps: the five tabs as one flow, done / next / current */
.steps { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; }
.steps::-webkit-scrollbar, .jobs::-webkit-scrollbar, .thumbs::-webkit-scrollbar { display: none; }
.steps a { display: flex; align-items: center; gap: 8px; padding: 10px 16px 11px 2px; color: var(--muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.steps a + a { padding-left: 16px; }
.steps a b { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 11px;
  font-weight: 700; border: 1px solid var(--line2); color: var(--muted); flex: none; transition: background .15s; }
.steps a.done b { background: var(--ok); border-color: var(--ok); color: #fff; }
.steps a.next b { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 3px rgba(231,0,2,.18); }
.steps a.on { color: var(--text); border-bottom-color: var(--accent); }
.steps a:hover { color: var(--text); }
.nextstep { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; padding: 12px 14px; margin-bottom: 18px;
  border-radius: var(--r); border: 1px solid rgba(231,0,2,.35);
  background: linear-gradient(90deg, rgba(231,0,2,.13), rgba(231,0,2,0) 70%), var(--panel); }
.nextstep.ok { border-color: var(--ok-line); background: var(--panel); }
.nextstep .k { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); width: 100%; }
.nextstep .t { font-weight: 600; min-width: 0; overflow-wrap: anywhere; flex: 1 1 200px; }
a.btn { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: var(--on-accent);
  border-radius: 9px; padding: 7px 13px; font-weight: 600; font-size: 13px; white-space: nowrap; }
a.btn:hover { background: var(--accent2); }
.progress { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-top: 2px; }
.progress i { height: 4px; border-radius: 2px; background: var(--line); }
.progress i.done { background: var(--ok); } .progress i.next { background: var(--accent); }
.next-line { font-size: 12px; color: var(--text); } .next-line span { color: var(--muted); }
.setup { text-align: left; max-width: 560px; margin: 0 auto; }
.setup ol { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 6px; color: var(--text); }
.setup code { font: 12px var(--mono); background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.side-status .short { display: none; }

.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }

.banner { padding: 10px 14px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); font-size: 13px; }
.banner.warn { border-color: var(--warn-line); } .banner.ok { border-color: var(--ok-line); }
.banner.fail { border-color: var(--fail-line); }
.banner b { font-weight: 600; }
#offline { margin-bottom: 16px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
#offline .dot { align-self: center; }
#demo { margin-bottom: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-color: rgba(231,0,2,.4); }
.empty { color: var(--muted); padding: 30px 16px; text-align: center; border: 1px dashed var(--line); border-radius: var(--r); }
.why { font-size: 12px; color: var(--muted); }
.why.warn { color: var(--warn); } .why.fail { color: var(--fail); }

/* jobs strip */
.jobs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; scrollbar-width: none; }
.jobs:empty { display: none; }
.job { flex: none; display: flex; align-items: center; gap: 2px; max-width: 280px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; font-size: 12px; color: var(--text);
  font-weight: 500; cursor: pointer; }
.job:hover:not(:disabled) { background: var(--panel2); }
.job span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job.klaar { border-color: var(--ok-line); } .job.fout { border-color: var(--fail-line); } .job.bezig { border-color: var(--warn-line); }
.jobmsg { margin: -8px 0 18px; }
pre.out { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 6px 0 0;
  overflow: auto; max-height: 260px; font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.jobs-list { display: flex; flex-direction: column; gap: 10px; }

/* grade */
.stage { position: relative; background: #000; border-radius: 10px; overflow: hidden; touch-action: pan-y; user-select: none;
  aspect-ratio: 16/9; cursor: ew-resize; }
.stage canvas, .stage img.orig { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.stage img.orig { pointer-events: none; }
.stage .split { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.35); pointer-events: none; }
.stage .split::after { content: "‹ ›"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: #fff; color: #111; font-size: 12px; font-weight: 700; border-radius: 12px; padding: 2px 7px; white-space: nowrap; }
.stage .lbl { position: absolute; top: 8px; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 6px;
  background: rgba(0,0,0,.6); color: #fff; pointer-events: none; }
.stage .lbl.l { left: 8px; } .stage .lbl.r { right: 8px; }
.stage .msg { position: absolute; inset: 0; display: grid; place-items: center; color: #b9bdc8; font-size: 13px;
  text-align: center; padding: 16px; }
.thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.thumb { flex: none; width: 112px; padding: 0; border-radius: 8px; overflow: hidden; background: var(--panel2);
  border: 2px solid transparent; position: relative; }
.thumb:hover:not(:disabled) { background: var(--panel2); border-color: var(--line2); }
.thumb.on { border-color: var(--accent); }
.thumb img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
.thumb i { position: absolute; left: 4px; bottom: 4px; font-style: normal; font-size: 10px; font-weight: 600;
  background: rgba(0,0,0,.7); color: #fff; border-radius: 4px; padding: 0 5px; }
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.chip { background: var(--panel2); color: var(--text); border: 1px solid var(--line); font-weight: 500; text-align: left;
  padding: 8px 10px; white-space: normal; line-height: 1.25; }
.chip:hover:not(:disabled) { background: var(--panel2); border-color: var(--line2); }
.chip.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.chip small { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }
.slider { display: grid; gap: 4px; }
.slider .top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.slider .top b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.confirm { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border: 1px solid var(--warn-line);
  border-radius: 10px; background: var(--panel2); }

.review img { width: 100%; border-radius: 10px; display: block; background: #000; }
video { width: 100%; border-radius: 10px; background: #000; display: block; }

#toasts { position: fixed; top: 16px; right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column;
  gap: 8px; z-index: 30; max-width: calc(100vw - 32px); }
.toast { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--blue); padding: 10px 14px;
  border-radius: 8px; max-width: 380px; box-shadow: 0 10px 30px var(--shadow); font-size: 13px; overflow-wrap: anywhere; }
.toast.err { border-left-color: var(--fail); } .toast.ok { border-left-color: var(--ok); }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .side { position: sticky; top: 0; height: auto; flex-direction: row; align-items: center; z-index: 10; gap: 8px;
    padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { padding: 4px 0; } .brand span:last-child { display: none; }
  nav { flex-direction: row; } nav a { padding: 8px 10px; } nav a.on { box-shadow: inset 0 -2px 0 var(--accent); }
  .side-status { margin: 0 0 0 auto; flex-direction: row; gap: 10px; min-width: 0; }
  .side-status .full { display: none; }
  .side-status .short { display: inline; font-size: 12px; }
  .side-status > div { display: flex; align-items: center; }
  main { padding-block: 18px 90px; padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .cols-grade, .cols-2 { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 22px; }
}
@media (max-width: 480px) { nav a span { display: none; } .card { padding: 14px; }
  .steps a:not(.on) span { display: none; } .steps a { padding-right: 10px; } .steps a + a { padding-left: 10px; } }
@media (prefers-reduced-motion: reduce) { .pcard { transition: none; } }
</style>

<script id="grade-math">
// Pure grade maths and request text, shared by the page and tests/studio_page_lut_test.js (no DOM here).
// Same two stages as webapp/studio_assets.py and autoedit/grade.py build_lut:
//   x' = clamp(x + exposure*0.0769) (log only) -> c = conv(x') (log only, skipped without conv)
//   -> o = look(c) -> out = c + (o - c)*strength
(function (root) {
  "use strict";
  const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);

  // .cube text -> {n, data}; data[((b*n + g)*n + r)*3 + ch], rows red-fastest like grade.read_cube / write_cube.
  function parseCube(text) {
    let n = 0;
    const vals = [];
    for (const raw of String(text).split(/\r?\n/)) {
      const s = raw.trim();
      if (!s || s[0] === "#") continue;
      if (/^LUT_3D_SIZE\b/i.test(s)) { n = parseInt(s.split(/\s+/).pop(), 10); continue; }
      const c = s[0];
      if ((c >= "0" && c <= "9") || c === "-" || c === ".") {
        const p = s.split(/\s+/);
        if (p.length === 3) vals.push(+p[0], +p[1], +p[2]);
      }
    }
    if (!(n >= 2 && n <= 129) || vals.length !== n * n * n * 3 || vals.some((v) => !Number.isFinite(v)))
      throw new Error("LUT-bestand niet te lezen");
    return { n, data: Float32Array.from(vals) };
  }

  // Trilinear lookup, the same as grade.apply_cube.
  function sample(lut, rgb) {
    const n = lut.n, d = lut.data, m = n - 1;
    const x = [clamp01(rgb[0]) * m, clamp01(rgb[1]) * m, clamp01(rgb[2]) * m];
    const i0 = x.map(Math.floor), i1 = i0.map((i) => Math.min(i + 1, m)), f = x.map((v, k) => v - i0[k]);
    const at = (b, g, r, ch) => d[((b * n + g) * n + r) * 3 + ch];
    const out = [0, 0, 0];
    for (let ch = 0; ch < 3; ch++) {
      const c00 = at(i0[2], i0[1], i0[0], ch) * (1 - f[0]) + at(i0[2], i0[1], i1[0], ch) * f[0];
      const c01 = at(i0[2], i1[1], i0[0], ch) * (1 - f[0]) + at(i0[2], i1[1], i1[0], ch) * f[0];
      const c10 = at(i1[2], i0[1], i0[0], ch) * (1 - f[0]) + at(i1[2], i0[1], i1[0], ch) * f[0];
      const c11 = at(i1[2], i1[1], i0[0], ch) * (1 - f[0]) + at(i1[2], i1[1], i1[0], ch) * f[0];
      const c0 = c00 * (1 - f[1]) + c01 * f[1], c1 = c10 * (1 - f[1]) + c11 * f[1];
      out[ch] = c0 * (1 - f[2]) + c1 * f[2];
    }
    return out;
  }

  // rgb 0..1 -> graded rgb 0..1. conv/look: parsed cubes or null.
  function gradePixel(rgb, conv, look, exposure, strength, isLog) {
    let c = [rgb[0], rgb[1], rgb[2]];
    if (isLog) {
      const e = exposure * 0.0769;                 // one stop in S-Log3 code values (grade.build_lut)
      c = c.map((v) => clamp01(v + e));
      if (conv) c = sample(conv, c);
    }
    const o = look ? sample(look, c) : c;
    return c.map((v, k) => clamp01(v + (o[k] - v) * strength));
  }

  // Request text for the Studio session, exactly webapp/studio.py's format. Returns {text} or {error}.
  const ACTIONS = ["plan", "grade", "goedkeuren", "preview", "render", "qa", "stills"];

function demoRun(action, p, extra) {

// WebGL preview: still + two LUTs (33 slices side by side in a 2D texture), trilinear lookup in the fragment shader.
// Falls back to the same maths on the CPU (2D canvas) when WebGL is missing.
function makePreview(canvas) {

  const VS = "attribute vec2 p; varying vec2 uv; void main(){ uv = vec2(p.x*.5+.5, .5-p.y*.5); gl_Position = vec4(p,0.,1.); }";
  const FS = `#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 uv; uniform sampler2D img, convT, lookT; uniform float nConv, nLook, expo, strength, isLog, hasConv, hasLook;
vec3 at(sampler2D t, float n, float r, float g, float b){ return texture2D(t, vec2((b*n + r + .5)/(n*n), (g + .5)/n)).rgb; }
vec3 lut(sampler2D t, float n, vec3 c){
  vec3 x = clamp(c, 0., 1.) * (n - 1.); vec3 i0 = floor(x); vec3 i1 = min(i0 + 1., n - 1.); vec3 f = x - i0;
  vec3 c00 = mix(at(t,n,i0.r,i0.g,i0.b), at(t,n,i1.r,i0.g,i0.b), f.r);
  vec3 c01 = mix(at(t,n,i0.r,i1.g,i0.b), at(t,n,i1.r,i1.g,i0.b), f.r);
  vec3 c10 = mix(at(t,n,i0.r,i0.g,i1.b), at(t,n,i1.r,i0.g,i1.b), f.r);
  vec3 c11 = mix(at(t,n,i0.r,i1.g,i1.b), at(t,n,i1.r,i1.g,i1.b), f.r);
  return mix(mix(c00, c01, f.g), mix(c10, c11, f.g), f.b);

void main(){
  vec3 c = texture2D(img, uv).rgb;
  if (isLog > .5) { c = clamp(c + expo * .0769, 0., 1.); if (hasConv > .5) c = lut(convT, nConv, c); }
  vec3 o = hasLook > .5 ? lut(lookT, nLook, c) : c;
  gl_FragColor = vec4(clamp(c + (o - c) * strength, 0., 1.), 1.);
}`;
  function initGL() {
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    floatTex = !!gl.getExtension("OES_texture_float");
    ["img", "convT", "lookT"].forEach((name, unit) => {
      const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      const filt = name === "img" ? gl.LINEAR : gl.NEAREST;
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filt); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filt);
      gl.uniform1i(gl.getUniformLocation(prog, name), unit); tex[name] = t;
    });
  }
  if (gl) { try { initGL(); } catch (e) { gl = null; } }
  if (!gl) self.note = "Voorbeeld via de processor (geen WebGL): wat trager.";

  function lutTexture(unit, name, cube) {
    has[name.replace("T", "")] = !!cube;
    if (!cube) return;
    const n = cube.n, w = n * n, src = cube.data;
    const data = floatTex ? new Float32Array(w * n * 4) : new Uint8Array(w * n * 4);
    for (let b = 0; b < n; b++) for (let g = 0; g < n; g++) for (let r = 0; r < n; r++) {
      const s = ((b * n + g) * n + r) * 3, o = (g * w + b * n + r) * 4;
      for (let ch = 0; ch < 3; ch++) data[o + ch] = floatTex ? src[s + ch] : Math.round(Math.min(1, Math.max(0, src[s + ch])) * 255);
      data[o + 3] = floatTex ? 1 : 255;
    }
    gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex[name]);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false); gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, n, 0, gl.RGBA, floatTex ? gl.FLOAT : gl.UNSIGNED_BYTE, data);

  }
  function loadImage(url, cors) {
    return new Promise((res, rej) => {
      const im = new Image();
      if (cors) im.crossOrigin = "anonymous";
      im.onload = () => res(im); im.onerror = () => rej(new Error("laden mislukt"));
      im.src = url;
    });
  }
  self.setImage = async (url) => {
    let im = null;
    try { im = await loadImage(url, true); } catch (e) { im = await loadImage(url, false); }
    img = im; readable = true;
    canvas.width = im.naturalWidth || 1280; canvas.height = im.naturalHeight || 720;
    if (gl) {
      try {
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex.img);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im);
      } catch (e) { readable = false; }
    } else {
      const k = Math.min(1, 960 / canvas.width);
      canvas.width = Math.round(canvas.width * k); canvas.height = Math.round(canvas.height * k);
      const ctx = canvas.getContext("2d"); ctx.drawImage(im, 0, 0, canvas.width, canvas.height);
      try { cpu = ctx.getImageData(0, 0, canvas.width, canvas.height); } catch (e) { cpu = null; readable = false; }
    }
    self.note = readable ? (gl ? "" : self.note) : "Dit beeld kan niet ingekleurd worden in de browser; je ziet het origineel.";

  };
  self.setLuts = (conv, look) => {

    if (gl) { lutTexture(1, "convT", conv); lutTexture(2, "lookT", look); }
  };

    pending = false;
    if (!img || !readable || !last) return;
    canvas.style.visibility = "visible";
    if (gl) {
      gl.viewport(0, 0, canvas.width, canvas.height);
      const u = (n, v) => gl.uniform1f(gl.getUniformLocation(prog, n), v);
      u("nConv", sizes.conv || 2); u("nLook", sizes.look || 2); u("expo", last.exposure); u("strength", last.strength);
      u("isLog", last.isLog ? 1 : 0); u("hasConv", has.conv ? 1 : 0); u("hasLook", has.look ? 1 : 0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    } else if (cpu) {
      const ctx = canvas.getContext("2d"), out = new ImageData(cpu.width, cpu.height), s = cpu.data, o = out.data;
      for (let i = 0; i < s.length; i += 4) {
        const g = gradePixel([s[i] / 255, s[i + 1] / 255, s[i + 2] / 255], cpuLuts.conv, cpuLuts.look, last.exposure, last.strength, last.isLog);
        o[i] = g[0] * 255 + 0.5; o[i + 1] = g[1] * 255 + 0.5; o[i + 2] = g[2] * 255 + 0.5; o[i + 3] = 255;
      }
      ctx.putImageData(out, 0, 0);

  }
  self.draw = (params) => { last = params; if (!pending) { pending = true; requestAnimationFrame(paint); } };
  self.destroy = () => { const ext = gl && gl.getExtension("WEBGL_lose_context"); if (ext) ext.loseContext(); gl = null; };
  self.mode = () => (gl ? (floatTex ? "webgl-float" : "webgl-byte") : "cpu");
  return self;
}

// ---------------------------------------------------------- tab: plan
function planTab(el, id) {
  el.innerHTML = `<div class="grid cols-2">
    <div class="card"><h2>Plan</h2><div id="pinfo"></div></div>
    <div class="card stack"><h2 style="margin:0">Op je PC</h2>
      <div class="row"><button data-pc id="planBtn">Plan maken</button><button class="dark" data-pc id="prevBtn">Voorbeeld</button></div>
      <div class="confirm" id="confirm" hidden><span>Je huidige goedkeuring vervalt met een nieuw plan. Toch een nieuw plan maken?</span>
        <div class="row"><button data-pc id="planYes">Ja, nieuw plan</button><button class="ghost" id="planNo">Annuleren</button></div></div>
      <div class="why" id="pwhy"></div></div></div>
    <div class="card" id="pvid" style="margin-top:16px" hidden><h2>Voorbeeldvideo</h2><video controls preload="metadata" playsinline></video></div>
    <div class="card review" id="sheet" style="margin-top:16px" hidden><h2>Storyboard</h2><img alt="Storyboard van het plan"></div>`;
  let P = null;
  const D = () => draft(id, project(id));
  const showConfirm = (on) => { D().confirmPlan = on; $("#confirm", el).hidden = !on; $("#planBtn", el).hidden = on; };
  $("#planBtn", el).onclick = (e) => { if (P.approval && P.approval.status === "approved") return showConfirm(true); send(e.currentTarget, "plan", P); };
  $("#planYes", el).onclick = (e) => { send(e.currentTarget, "plan", P).then(() => showConfirm(false)); };
  $("#planNo", el).onclick = () => showConfirm(false);
  $("#prevBtn", el).onclick = (e) => send(e.currentTarget, "preview", P);
  return {
    update(p) {
      P = p;
      const pl = p.plan;
      $("#pinfo", el).innerHTML = pl ? `<dl class="kv"><dt>Titel</dt><dd>${esc(pl.title || "—")}</dd>
          <dt>Shots</dt><dd>${+pl.shots || 0}</dd><dt>Duur</dt><dd>${(+pl.duration || 0).toFixed(1).replace(".", ",")} s</dd>
          <dt>Plan-code</dt><dd class="mono">${esc(pl.edl_sha1 || "—")}</dd></dl>`
        : '<div class="muted">Nog geen plan. Plan maken kiest de shots en maakt een storyboard op je PC.</div>';
      const sheet = pl && safeUrl(pl.sheet_url);
      $("#sheet", el).hidden = !sheet;
      if (sheet && $("#sheet img", el).getAttribute("src") !== sheet) $("#sheet img", el).src = sheet;
      const pv = pl && safeUrl(pl.preview_url);
      $("#pvid", el).hidden = !pv;
      if (pv && $("#pvid video", el).getAttribute("src") !== pv) $("#pvid video", el).src = pv;
      $("#prevBtn", el).dataset.block = pl ? "" : "1";
      showConfirm(D().confirmPlan);
      $("#pwhy", el).textContent = online() ? (pl ? "Voorbeeld rendert een snelle versie op halve grootte." : "Voorbeeld kan pas als er een plan is.") : offlineReason();
      $("#pwhy", el).className = "why" + (online() ? "" : " warn");
      pcButtons(el);
    },
  };
}

// ---------------------------------------------------------- tab: goedkeuren
function approveTab(el, id) {
  el.innerHTML = `<div class="grid cols-2">
    <div class="card stack"><h2 style="margin:0">Wat je goedkeurt</h2><div class="banner" id="astate"></div><div id="ainfo"></div></div>
    <div class="card stack"><h2 style="margin:0">Goedkeuren</h2>
      <label>Wat keur je goed (in je eigen woorden)<input type="text" id="note" maxlength="300" autocomplete="off" placeholder="bijv. ja, render zo, titel is goed"></label>
      <div class="row"><button data-pc id="okBtn">Goedkeuren</button><span class="muted small" id="count"></span></div>
      <div class="why" id="awhy"></div></div></div>`;
  let P = null;
  const D = () => draft(id, project(id));
  const input = $("#note", el);
  input.value = D().note;
  const check = () => {
    const g = P && P.grade || {};
    return requestText("goedkeuren", P ? P.name : "", { plan: P && P.plan && P.plan.edl_sha1, grade: g.key, note: input.value });
  };
  function state() {
    if (!P) return;
    const r = check(), empty = !input.value.trim();
    $("#okBtn", el).dataset.block = r.error ? "1" : "";
    $("#count", el).textContent = input.value.length ? input.value.length + " / 300" : "";
    const why = !online() ? offlineReason() : empty ? "Schrijf eerst in je eigen woorden wat je goedkeurt." : r.error || "Je keurt het plan en de opgeslagen grade hiernaast samen goed.";
    $("#awhy", el).textContent = why;
    $("#awhy", el).className = "why" + (!online() || (!empty && r.error) ? " warn" : "");
    pcButtons(el);
  }
  input.oninput = () => { D().note = input.value; state(); };
  $("#okBtn", el).onclick = (e) => {
    const r = check();
    if (r.error) return toast(r.error, "err");
    send(e.currentTarget, "goedkeuren", P, { plan: P.plan.edl_sha1, grade: P.grade.key, note: input.value }).then((ok) => {
      if (ok) { input.value = ""; D().note = ""; state(); }
    });
  };
  return {
    update(p) {
      P = p;
      const st = approvalState(p), a = p.approval, g = p.grade || {}, d = D();
      $("#astate", el).className = "banner " + st.cls;
      $("#astate", el).innerHTML = esc(st.text) + (a && a.status === "approved" && (a.by || a.at) ? `<br><span class="muted small">door ${esc(a.by || "?")}${a.at ? " · " + esc(when(a.at)) : ""}</span>` : "");
      const tryOther = g.look != null && (g.look !== d.look || Math.abs(+g.strength - d.strength) > 0.004 || Math.abs(+g.exposure - d.exposure) > 0.004);
      $("#ainfo", el).innerHTML = `<dl class="kv"><dt>Plan</dt><dd>${p.plan ? `<span class="mono">${esc(p.plan.edl_sha1 || "—")}</span> · ${+p.plan.shots || 0} shots` : "nog geen plan"}</dd>
        <dt>Grade</dt><dd>${g.look != null ? `${esc(lookName(g.look))} · ${esc(pct(g.strength))} · ${esc(stops(g.exposure))}` : "onbekend"}</dd></dl>` +
        (tryOther ? `<div class="why warn" style="margin-top:8px">Je hebt bij Grade een andere grade geprobeerd maar niet gekozen. Je keurt de opgeslagen grade goed.</div>` : "");
      state();
    },
  };
}

// ---------------------------------------------------------- tab: renderen
function renderTab(el, id) {
  el.innerHTML = `<div class="grid cols-2">
    <div class="card stack"><h2 style="margin:0">Renderen</h2><div class="banner" id="rstate"></div>
      <div class="row"><button data-pc id="renderBtn">Renderen</button><button class="dark" data-pc id="qaBtn">QA</button></div>
      <div class="why" id="rwhy"></div></div>
    <div class="card"><h2>Laatste render</h2><div id="rinfo"></div></div></div>`;
  let P = null;
  $("#renderBtn", el).onclick = (e) => send(e.currentTarget, "render", P);
  $("#qaBtn", el).onclick = (e) => send(e.currentTarget, "qa", P);
  return {
    update(p) {
      P = p;
      const a = p.approval, st = approvalState(p);
      const ready = !!(a && a.current && a.grade_current);
      $("#rstate", el).className = "banner " + st.cls;
      $("#rstate", el).textContent = st.text;
      $("#renderBtn", el).dataset.block = ready ? "" : "1";
      $("#qaBtn", el).dataset.block = p.render ? "" : "1";
      $("#rwhy", el).textContent = !online() ? offlineReason()
        : !ready ? (a && a.current && !a.grade_current ? "grade gewijzigd: opnieuw goedkeuren" : "Renderen kan pas na je goedkeuring van dit plan en deze grade.")
        : "Rendert de volledige montage met de goedgekeurde grade. QA controleert daarna geluid en beeld.";
      $("#rwhy", el).className = "why" + (!online() || !ready ? " warn" : "");
      $("#rinfo", el).innerHTML = p.render ? `<dl class="kv"><dt>Gerenderd</dt><dd>${esc(when(p.render.at) || "—")}</dd></dl>
        <p class="muted small" style="margin-bottom:0">Bekijk hem bij <a href="#/p/${enc(id)}/resultaat" style="color:var(--blue)">Resultaat</a>.</p>` : '<div class="muted">Nog niet gerenderd.</div>';
      pcButtons(el);
    },
  };
}

// ---------------------------------------------------------- tab: resultaat
function resultTab(el) {
  el.innerHTML = `<div id="res"></div>`;
  let key = null;
  return {
    update(p) {
      const r = p.render, review = r && safeUrl(r.review_url), prev = r && safeUrl(r.preview_url);
      const k = [review, prev, r && r.at].join("|");
      if (k === key) return;
      key = k;
      $("#res", el).innerHTML = !r ? '<div class="empty">Nog geen render. Render eerst bij Renderen.</div>'
        : `<div class="stack"><div class="muted small">Gerenderd ${esc(when(r.at))}</div>
          ${prev ? `<div class="card"><h2>Voorbeeldvideo</h2><video controls preload="metadata" playsinline src="${esc(prev)}"></video></div>`
            : '<div class="banner">Geen voorbeeldvideo (te groot om te uploaden). De volledige render staat op je PC.</div>'}
          ${review ? `<div class="card review"><h2>Review: een beeld per accent</h2><img src="${esc(review)}" alt="Reviewbeeld van de render"></div>` : ""}</div>`;
    },
  };
}

render();
start();
</script>
