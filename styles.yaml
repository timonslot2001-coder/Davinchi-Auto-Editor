# ============================================================
#  Edit styles. Your house style is "cinematic" (config default_style) — used for every category.
#  The other styles below are optional alternatives, only used if you pass --style explicitly.
#  Copy one to make your own ("templates you build yourself").
#  Numbers are probabilities (0..1) or seconds.
# ============================================================

fitness:
  label: "Fitness hype"
  look: "Outdoors"
  pacing:                 # shot length in seconds per part of the video
    hook: 0.35             # first ~2 s: very fast
    body: 0.63
    outro: 0.84
  cut_on_beat: true
  hook_text: true
  effects:                # chance per cut that this effect is used
    punch_zoom: 0.23
    smooth_zoom: 0.07
    shake: 0.15
    invert_flash: 0.06
    white_flash: 0.05
    whip: 0.07
    glitch: 0.03
    speed_ramp: 0.25
    pop_in: 0.0
  grid6: true             # 6-panel grid section
  overlay: { enabled: false }
  sfx: { cut: "whoosh", zoom: "hit", grid: "click", flash: "impact", ramp: "riser" }
  retention_interval_s: 2.4
  loop_ending: true

