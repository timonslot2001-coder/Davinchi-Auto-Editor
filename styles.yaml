cinematic:
  # Modelled on your reference (LA travel edit). Less is more: story arc, steady rhythm, no added effects.
  label: "Cinematic (reference)"
  mode: "cinematic"
  aspect: "16:9"            # like the reference; "9:16" also works
  look: "Daylight"          # warm, teal sky / orange highlights
  length_s: 13.0
  intro_cuts: [0.27, 0.25]  # first two cuts are quick, then steady
  shot_s: 0.8               # without music; with music: 2 beats per shot
  final_hold: 1.7           # long hold on the widest shot at the end
  dip_to_black: true
  dip_chance: 0.5           # only in about half of the videos, so they don't all look the same
  dip_s: 0.33
  light_leak: true          # orange film burn into the final hold
  whip_first_body: true
  frame_in_frame: 1         # shots shown as a 'photo' on a paper backdrop (refs A/B)
  bw_accents: 1             # black & white shots in the calmer parts (ref B)
  corner_label: "VLOG_01"   # tiny corner labels over the intro, title on the right (ref A); null = off
  title_size: 0.065         # title letter height as share of the frame's short side (0.03 = small)
  title: null               # e.g. "UTRECHT" → small, widely spaced title over the intro (or --title)
  overlay: { enabled: false }
  sfx: { cut: "whoosh", leak: "swell" }
  effects: {}
  pacing: { hook: 0.27, body: 0.8, outro: 1.7 }
  grid6: false
  hook_text: false
  loop_ending: false
# cinematic also follows the song when there is one (2nd reference, music-driven):
#   music_driven: true → first cut on the first big hit, shot length follows the music's energy
#   (quiet → long holds, loud → faster cuts, always on a beat), final shot starts on the last big hit.
# accents from refs A/B (Shanghai vlog, Austria hiking), used sparingly so it stays one style:
