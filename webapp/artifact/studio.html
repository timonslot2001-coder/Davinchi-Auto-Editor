<title>AutoEdit Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* AutoEdit Studio (claude.ai Artifact). Data comes only from the Artifact db, written by the Studio session on Timon's
   PC; every PC button sends one comment to that session (webapp/studio.py format).
   Layout: a grading-suite monitor at night. Sidebar rack, glass panels on an ink ground with a faint scope graticule,
   one cold signal pair (IJs: ice blue and silver), mono read-outs. One dark world on purpose. */
:root {
  --void: #070a0f; --panel: rgba(12, 17, 27, .8); --panel-solid: #0b1019; --panel2: rgba(25, 34, 52, .74);
  --bar: rgba(7, 10, 16, .9); --line: rgba(138, 170, 230, .11); --line2: rgba(138, 170, 230, .24);
  --track: rgba(138, 170, 230, .17); --grid-rgb: 120 160 230;
  --text: #e6ecf8; --muted: #8a95ad; --dim: #5a647d;
  --a1: #9fdcff; --a2: #d7e3ff; --a1-rgb: 159 220 255; --a2-rgb: 215 227 255; --on-accent: #04060b;
  --ok: #4ee59b; --warn: #ffc65a; --fail: #ff5a76; --ok-rgb: 78 229 155; --warn-rgb: 255 198 90; --fail-rgb: 255 90 118;
  --blue: var(--a1); --shadow: rgba(0, 0, 0, .55); --r: 14px; --r-sm: 9px;
  --display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --font: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--void); color: var(--text); font: 14px/1.55 var(--font); }
body { -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); }
a { color: inherit; text-decoration: none; }
h1 { font: 600 26px/1.15 var(--display); margin: 0; letter-spacing: -.01em; text-wrap: balance; overflow-wrap: anywhere; }
h2 { font: 500 11px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .16em; color: var(--muted); margin: 0 0 14px;
  display: flex; align-items: center; gap: 8px; }
h2::before { content: ""; width: 6px; height: 6px; border-radius: 2px; flex: none; background: var(--a1);
  box-shadow: 0 0 10px rgb(var(--a1-rgb) / .8); }
.muted { color: var(--muted); } .small { font-size: 12px; } .mono { font-family: var(--mono); }
.spacer { flex: 1; }

/* ground: a faint graticule and two glows, behind everything */
.atmo { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(900px 520px at 8% -8%, rgb(var(--a1-rgb) / .13), transparent 62%),
    radial-gradient(760px 560px at 105% 105%, rgb(var(--a2-rgb) / .07), transparent 60%); }
.atmo::after { content: ""; position: absolute; inset: 0; background-size: 36px 36px;
  background-image: linear-gradient(rgb(var(--grid-rgb) / .055) 1px, transparent 1px),
    linear-gradient(90deg, rgb(var(--grid-rgb) / .055) 1px, transparent 1px);
  -webkit-mask-image: radial-gradient(ellipse 85% 70% at 50% 0%, #000 25%, transparent 80%);
  mask-image: radial-gradient(ellipse 85% 70% at 50% 0%, #000 25%, transparent 80%); }

.shell { position: relative; z-index: 1; display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--bar); -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
  border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 22px; }
.brand { display: flex; align-items: center; gap: 11px; padding: 4px 6px; font: 600 13px/1.2 var(--display); letter-spacing: .02em; }
.brand b { font-weight: 600; background: linear-gradient(90deg, var(--a1), var(--a2)); -webkit-background-clip: text;
  background-clip: text; color: transparent; }
.logo { width: 28px; height: 28px; border-radius: 8px; flex: none; position: relative;
  background: linear-gradient(135deg, var(--a1), var(--a2)); box-shadow: 0 0 18px -2px rgb(var(--a1-rgb) / .65); }
.logo::after { content: ""; position: absolute; left: 10px; top: 8px; border-left: 10px solid var(--on-accent);
  border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
nav { display: flex; flex-direction: column; gap: 4px; }
nav a { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: var(--r-sm); color: var(--muted);
  border: 1px solid transparent; }
nav a i { font-style: normal; width: 18px; text-align: center; }
nav a:hover { color: var(--text); background: var(--panel2); }
nav a.on { color: var(--text); background: rgb(var(--a1-rgb) / .08); border-color: rgb(var(--a1-rgb) / .28);
  box-shadow: 0 0 22px -10px rgb(var(--a1-rgb) / .8); }
nav em { margin-left: auto; font: 600 10.5px/1.6 var(--mono); background: var(--a1); color: var(--on-accent);
  border-radius: 6px; padding: 0 6px; }
.side-status { margin-top: auto; display: flex; flex-direction: column; gap: 7px; font: 11.5px/1.4 var(--mono); color: var(--muted); }
.side-status > div { display: flex; align-items: center; }
.side-status .short { display: none; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 8px; background: var(--dim); flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 10px rgb(var(--ok-rgb) / .9); }
.dot.off { background: var(--fail); box-shadow: 0 0 10px rgb(var(--fail-rgb) / .8); }
.dot.busy { background: var(--warn); box-shadow: 0 0 10px rgb(var(--warn-rgb) / .9); animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }

main { padding-block: 30px 80px; padding-left: max(36px, env(safe-area-inset-left, 0px));
  padding-right: max(36px, env(safe-area-inset-right, 0px)); max-width: 1400px; width: 100%; min-width: 0; }
.head { display: flex; align-items: flex-end; gap: 12px 16px; margin-bottom: 20px; flex-wrap: wrap; }
.crumb { font: 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 8px; }
.crumb a:hover { color: var(--a1); }
.loading { color: var(--muted); padding: 40px 0; font-family: var(--mono); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0;
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .035), 0 18px 40px -24px var(--shadow); }
.grid { display: grid; gap: 16px; }
.grid > *, .stack > * { min-width: 0; }
.cols-grade { grid-template-columns: minmax(0, 1fr) minmax(290px, 350px); align-items: start; }
.cols-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }

.projects { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.pcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; min-width: 0;
  display: flex; flex-direction: column; transition: transform .16s, border-color .16s, box-shadow .16s; }
.pcard:hover { transform: translateY(-3px); border-color: rgb(var(--a1-rgb) / .45);
  box-shadow: 0 0 0 1px rgb(var(--a1-rgb) / .15), 0 18px 40px -18px rgb(var(--a1-rgb) / .45); }
.pcard .img { aspect-ratio: 16/9; max-width: 100%; background: var(--panel-solid); display: grid; place-items: center;
  color: var(--dim); font-size: 28px; overflow: hidden; position: relative; }
.pcard .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pcard .img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, var(--panel-solid)); }
.pcard .body { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
.pcard .name { font: 600 15px/1.25 var(--display); overflow-wrap: anywhere; }

.tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 6px; font: 500 11px/1.5 var(--mono);
  background: rgb(var(--grid-rgb) / .06); border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.tag.ok { color: var(--ok); border-color: rgb(var(--ok-rgb) / .35); background: rgb(var(--ok-rgb) / .07); }
.tag.warn { color: var(--warn); border-color: rgb(var(--warn-rgb) / .35); background: rgb(var(--warn-rgb) / .07); }
.tag.fail { color: var(--fail); border-color: rgb(var(--fail-rgb) / .35); background: rgb(var(--fail-rgb) / .07); }
.tag.blue { color: var(--a1); border-color: rgb(var(--a1-rgb) / .35); background: rgb(var(--a1-rgb) / .07); }
.tag.red { color: var(--on-accent); background: linear-gradient(90deg, var(--a1), var(--a2)); border-color: transparent; font-weight: 600; }

label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
input[type=text] { background: rgb(0 0 0 / .35); color: var(--text); border: 1px solid var(--line2); border-radius: var(--r-sm);
  padding: 10px 12px; font: inherit; width: 100%; min-width: 0; transition: border-color .15s, box-shadow .15s; }
input[type=text]::placeholder { color: var(--dim); }
input[type=text]:focus { outline: none; border-color: var(--a1); box-shadow: 0 0 0 3px rgb(var(--a1-rgb) / .18); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 0; background: transparent; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px;
  background: linear-gradient(90deg, var(--a2), var(--a1) var(--p, 50%), var(--track) var(--p, 50%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%;
  border: 0; background: var(--text); box-shadow: 0 0 0 3px rgb(var(--a1-rgb) / .35), 0 0 16px rgb(var(--a1-rgb) / .7); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--track); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--a2), var(--a1)); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; border: 0; background: var(--text);
  box-shadow: 0 0 0 3px rgb(var(--a1-rgb) / .35), 0 0 16px rgb(var(--a1-rgb) / .7); }

button { background: linear-gradient(135deg, var(--a1), var(--a2)); color: var(--on-accent); border: 0; border-radius: var(--r-sm);
  padding: 10px 16px; font: 600 13.5px/1.2 var(--font); cursor: pointer; white-space: nowrap;
  box-shadow: 0 0 0 1px rgb(var(--a1-rgb) / .35), 0 10px 26px -12px rgb(var(--a1-rgb) / .75);
  transition: filter .15s, box-shadow .15s, transform .15s; }
button:hover:not(:disabled) { filter: brightness(1.08);
  box-shadow: 0 0 0 1px rgb(var(--a1-rgb) / .55), 0 12px 30px -10px rgb(var(--a1-rgb) / .9); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; filter: saturate(.4); }
button.ghost { background: transparent; border: 1px solid var(--line2); color: var(--text); font-weight: 500; box-shadow: none; }
button.ghost:hover:not(:disabled) { border-color: rgb(var(--a1-rgb) / .5); color: var(--a1); filter: none;
  box-shadow: 0 0 18px -8px rgb(var(--a1-rgb) / .8); }
button.dark { background: var(--panel2); border: 1px solid var(--line2); color: var(--text); font-weight: 500; box-shadow: none; }
button.dark:hover:not(:disabled) { border-color: rgb(var(--a1-rgb) / .45); filter: none; box-shadow: 0 0 18px -8px rgb(var(--a1-rgb) / .7); }
button.sm { padding: 5px 11px; font-size: 12px; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--a1); outline-offset: 2px; }

/* steps: the five tabs as one flow, done / next / current */
.steps { display: flex; margin-bottom: 20px; padding: 2px 2px 12px; overflow-x: auto; scrollbar-width: none;
  border-bottom: 1px solid var(--line); }
.steps::-webkit-scrollbar, .jobs::-webkit-scrollbar, .thumbs::-webkit-scrollbar { display: none; }
.steps a { display: flex; align-items: center; gap: 9px; padding: 6px 12px 6px 0; color: var(--muted); white-space: nowrap; font-size: 13.5px; }
.steps a + a { padding-left: 12px; }
.steps a + a::before { content: ""; width: 18px; height: 1px; background: var(--line2); margin-right: 3px; flex: none; }
.steps a.done + a::before { background: rgb(var(--ok-rgb) / .6); box-shadow: 0 0 6px rgb(var(--ok-rgb) / .6); }
.steps a b { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; font: 600 11px/1 var(--mono);
  border: 1px solid var(--line2); color: var(--muted); flex: none; background: var(--panel-solid); transition: background .2s, box-shadow .2s; }
.steps a.done b { background: rgb(var(--ok-rgb) / .12); border-color: rgb(var(--ok-rgb) / .6); color: var(--ok);
  box-shadow: 0 0 12px -2px rgb(var(--ok-rgb) / .55); }
.steps a.next b { border-color: var(--a1); color: var(--a1); animation: pulse 2.2s ease-in-out infinite;
  box-shadow: 0 0 0 3px rgb(var(--a1-rgb) / .16), 0 0 16px rgb(var(--a1-rgb) / .55); }
.steps a.on { color: var(--text); font-weight: 600; }
.steps a.on b { background: linear-gradient(135deg, var(--a1), var(--a2)); border-color: transparent; color: var(--on-accent);
  box-shadow: 0 0 18px rgb(var(--a1-rgb) / .6); }
.steps a:hover { color: var(--text); }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgb(var(--a1-rgb) / .05), 0 0 22px rgb(var(--a1-rgb) / .75); } }
.nextstep { position: relative; display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; padding: 14px 16px;
  margin-bottom: 20px; border-radius: var(--r); border: 1px solid transparent;
  background: linear-gradient(var(--panel-solid), var(--panel-solid)) padding-box,
    linear-gradient(120deg, rgb(var(--a1-rgb) / .75), rgb(var(--a2-rgb) / .5) 60%, rgb(var(--a2-rgb) / .1)) border-box;
  box-shadow: 0 0 40px -18px rgb(var(--a1-rgb) / .55); }
.nextstep::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(600px 120px at 0% 0%, rgb(var(--a1-rgb) / .12), transparent 70%); }
.nextstep.ok { box-shadow: 0 0 40px -20px rgb(var(--ok-rgb) / .6);
  background: linear-gradient(var(--panel-solid), var(--panel-solid)) padding-box,
    linear-gradient(120deg, rgb(var(--ok-rgb) / .6), rgb(var(--ok-rgb) / .08)) border-box; }
.nextstep.ok::before { background: radial-gradient(600px 120px at 0% 0%, rgb(var(--ok-rgb) / .1), transparent 70%); }
.nextstep > * { position: relative; }
.nextstep .k { font: 500 10.5px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .16em; color: var(--a1); width: 100%; }
.nextstep.ok .k { color: var(--ok); }
.nextstep .t { font-weight: 600; font-size: 15px; min-width: 0; overflow-wrap: anywhere; flex: 1 1 200px; }
a.btn { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, var(--a1), var(--a2));
  color: var(--on-accent); border-radius: var(--r-sm); padding: 8px 14px; font-weight: 600; font-size: 13px; white-space: nowrap;
  box-shadow: 0 10px 26px -12px rgb(var(--a1-rgb) / .8); }
a.btn:hover { filter: brightness(1.08); }
.progress { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 2px; }
.progress i { height: 4px; border-radius: 2px; background: var(--track); }
.progress i.done { background: var(--ok); box-shadow: 0 0 8px rgb(var(--ok-rgb) / .7); }
.progress i.next { background: var(--a1); box-shadow: 0 0 10px rgb(var(--a1-rgb) / .9); animation: blink 1.8s ease-in-out infinite; }
.next-line { font-size: 12.5px; color: var(--text); }
.next-line span { color: var(--a1); font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .1em; margin-right: 4px; }
.setup { text-align: left; max-width: 580px; margin: 0 auto; }
.setup ol { margin: 12px 0 0; padding-left: 20px; display: grid; gap: 8px; color: var(--text); }
.setup code { font: 12px var(--mono); background: rgb(var(--a1-rgb) / .08); color: var(--a1); border: 1px solid rgb(var(--a1-rgb) / .25);
  border-radius: 5px; padding: 1px 6px; }

.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); font: 11px/1.9 var(--mono); text-transform: uppercase; letter-spacing: .1em; }
.kv dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }

.banner { padding: 11px 14px; border-radius: var(--r-sm); background: var(--panel); border: 1px solid var(--line); font-size: 13px; }
.banner.warn { border-color: rgb(var(--warn-rgb) / .4); background: linear-gradient(90deg, rgb(var(--warn-rgb) / .08), transparent 70%), var(--panel); }
.banner.ok { border-color: rgb(var(--ok-rgb) / .4); background: linear-gradient(90deg, rgb(var(--ok-rgb) / .08), transparent 70%), var(--panel); }
.banner.fail { border-color: rgb(var(--fail-rgb) / .4); }
.banner b { font-weight: 600; }
#offline { margin-bottom: 16px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
#offline .dot { align-self: center; }
#conn { margin-bottom: 16px; }
.empty { color: var(--muted); padding: 34px 18px; text-align: center; border: 1px dashed var(--line2); border-radius: var(--r);
  background: rgb(var(--grid-rgb) / .025); }
.why { font-size: 12px; color: var(--muted); }
.why.warn, .why .warn { color: var(--warn); } .why.fail, .why .fail { color: var(--fail); }

/* jobs strip */
.jobs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; scrollbar-width: none; }
.jobs:empty { display: none; }
.job { flex: none; display: flex; align-items: center; gap: 2px; max-width: 290px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 11px; font: 500 11.5px/1.4 var(--mono); color: var(--text); cursor: pointer; box-shadow: none; }
.job:hover:not(:disabled) { background: var(--panel2); border-color: var(--line2); filter: none; box-shadow: none; }
.job span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job.klaar { border-color: rgb(var(--ok-rgb) / .3); } .job.fout { border-color: rgb(var(--fail-rgb) / .35); }
.job.bezig { border-color: rgb(var(--warn-rgb) / .35); }
.jobmsg { margin: -8px 0 18px; }
pre.out { background: rgb(0 0 0 / .4); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 6px 0 0;
  overflow: auto; max-height: 260px; font: 12px/1.5 var(--mono); color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
.jobs-list { display: flex; flex-direction: column; gap: 10px; }

/* grade: the monitor with viewfinder corners, the read-out under it */
.lookgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.lookcard { display: flex; flex-direction: column; gap: 8px; padding: 8px; text-align: left; background: var(--panel2);
  border: 1.5px solid var(--line); border-radius: 12px; color: inherit; box-shadow: none; }
.lookcard img, .lookcard .ph { width: 100%; aspect-ratio: 16 / 3.2; object-fit: cover; border-radius: 8px; background: #000; display: block; }
.lookcard.on { border-color: var(--a1); box-shadow: 0 0 0 1px var(--a1); }
.lookcard .nm small { color: var(--muted); }
.stage { position: relative; background: #000; border-radius: 12px; overflow: hidden; touch-action: pan-y; user-select: none;
  aspect-ratio: 16/9; max-width: 100%; cursor: ew-resize; box-shadow: 0 0 0 1px var(--line2), 0 24px 60px -30px rgb(var(--a1-rgb) / .5); }
.stage::before { content: ""; position: absolute; inset: 12px; z-index: 2; pointer-events: none; opacity: .9;
  --c: rgb(var(--a1-rgb) / .9); background-repeat: no-repeat;
  background-image: linear-gradient(var(--c), var(--c)), linear-gradient(var(--c), var(--c)), linear-gradient(var(--c), var(--c)),
    linear-gradient(var(--c), var(--c)), linear-gradient(var(--c), var(--c)), linear-gradient(var(--c), var(--c)),
    linear-gradient(var(--c), var(--c)), linear-gradient(var(--c), var(--c));
  background-size: 18px 1.5px, 1.5px 18px, 18px 1.5px, 1.5px 18px, 18px 1.5px, 1.5px 18px, 18px 1.5px, 1.5px 18px;
  background-position: left top, left top, right top, right top, left bottom, left bottom, right bottom, right bottom; }
.stage canvas, .stage img.orig { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.stage img.orig { pointer-events: none; }
.stage .split { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; z-index: 3; background: var(--a1);
  box-shadow: 0 0 12px rgb(var(--a1-rgb) / .9); pointer-events: none; }
.stage .split::after { content: "‹ ›"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: linear-gradient(135deg, var(--a1), var(--a2)); color: var(--on-accent); font: 700 11px/1 var(--mono);
  border-radius: 999px; padding: 5px 8px; white-space: nowrap; box-shadow: 0 0 16px rgb(var(--a1-rgb) / .8); }
.stage .lbl { position: absolute; top: 20px; z-index: 3; font: 600 10px/1.6 var(--mono); letter-spacing: .14em; text-transform: uppercase;
  padding: 1px 8px; border-radius: 5px; background: rgb(0 0 0 / .55); color: #fff; pointer-events: none; }
.stage .lbl.l { left: 22px; } .stage .lbl.r { right: 22px; }
.stage .msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font: 12.5px/1.5 var(--mono);

<script id="grade-math">
// Pure grade maths and request text, shared by the page and tests/studio_page_lut_test.js (no DOM here).
// Same two stages as webapp/studio_assets.py and autoedit/grade.py build_lut:
//   x' = clamp(x + exposure*0.0769) (log only) -> c = conv(x') (log only, skipped without conv)
//   -> o = look(c) -> out = c + (o - c)*strength
(function (root) {
  "use strict";
  const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);

  // .cube text -> {n, data}; data[((b*n + g)*n + r)*3 + ch], rows red-fastest like grade.read_cube / write_cube.
  function parseCube(text) {
    let n = 0;
    const vals = [];
    for (const raw of String(text).split(/\r?\n/)) {
      const s = raw.trim();
      if (!s || s[0] === "#") continue;
      if (/^LUT_3D_SIZE\b/i.test(s)) { n = parseInt(s.split(/\s+/).pop(), 10); continue; }
      const c = s[0];
      if ((c >= "0" && c <= "9") || c === "-" || c === ".") {
        const p = s.split(/\s+/);
        if (p.length === 3) vals.push(+p[0], +p[1], +p[2]);
      }
    }
    if (!(n >= 2 && n <= 129) || vals.length !== n * n * n * 3 || vals.some((v) => !Number.isFinite(v)))
      throw new Error("LUT-bestand niet te lezen");
    return { n, data: Float32Array.from(vals) };
  }

  // Trilinear lookup, the same as grade.apply_cube.
  function sample(lut, rgb) {
    const n = lut.n, d = lut.data, m = n - 1;
    const x = [clamp01(rgb[0]) * m, clamp01(rgb[1]) * m, clamp01(rgb[2]) * m];
    const i0 = x.map(Math.floor), i1 = i0.map((i) => Math.min(i + 1, m)), f = x.map((v, k) => v - i0[k]);
    const at = (b, g, r, ch) => d[((b * n + g) * n + r) * 3 + ch];
    const out = [0, 0, 0];
    for (let ch = 0; ch < 3; ch++) {
      const c00 = at(i0[2], i0[1], i0[0], ch) * (1 - f[0]) + at(i0[2], i0[1], i1[0], ch) * f[0];
      const c01 = at(i0[2], i1[1], i0[0], ch) * (1 - f[0]) + at(i0[2], i1[1], i1[0], ch) * f[0];
      const c10 = at(i1[2], i0[1], i0[0], ch) * (1 - f[0]) + at(i1[2], i0[1], i1[0], ch) * f[0];
      const c11 = at(i1[2], i1[1], i0[0], ch) * (1 - f[0]) + at(i1[2], i1[1], i1[0], ch) * f[0];
      const c0 = c00 * (1 - f[1]) + c01 * f[1], c1 = c10 * (1 - f[1]) + c11 * f[1];
      out[ch] = c0 * (1 - f[2]) + c1 * f[2];
    }
    return out;
  }

  // rgb 0..1 -> graded rgb 0..1. conv/look: parsed cubes or null.
  function gradePixel(rgb, conv, look, exposure, strength, isLog) {
    let c = [rgb[0], rgb[1], rgb[2]];
    if (isLog) {
      const e = exposure * 0.0769;                 // one stop in S-Log3 code values (grade.build_lut)
      c = c.map((v) => clamp01(v + e));
      if (conv) c = sample(conv, c);
    }
    const o = look ? sample(look, c) : c;
    return c.map((v, k) => clamp01(v + (o[k] - v) * strength));
  }

  // Request text for the Studio session, exactly webapp/studio.py's format. Returns {text} or {error}.
  const SSD = ["ssd-ververs", "ssd-bekijk", "ssd-clip", "ssd-verplaats", "ssd-edit"];
  const ACTIONS = ["plan", "grade", "goedkeuren", "preview", "render", "qa", "stills", "uitleg", "juict-resolve", "juict-montage", "juict-film"].concat(SSD);
  // JUICT explainer film (webapp/studio.py _parse_uitleg): no project; the PC session makes a Motion film in the JUICT look.
  const UITLEG_LEN = [15, 20, 30, 45, 60];
  const UITLEG_FMT = ["16:9", "9:16", "1:1"];
  const CTRL_RE = /[\u0000-\u001f\u007f]/;
  function uitlegText(extra) {
    const titel = String(extra.titel == null ? "" : extra.titel).trim();
    const doel = String(extra.doel == null ? "" : extra.doel).trim();
    const notitie = String(extra.notitie == null ? "" : extra.notitie).trim();
    const stappen = String(extra.stappen == null ? "" : extra.stappen).split(/\r?\n/).map((s) => s.trim().replace(/^(\d+[.)]|[-*•])\s*/, "")).filter(Boolean);
    if (!titel) return { error: "geef de video een titel" };
    if (titel.length > 80 || CTRL_RE.test(titel)) return { error: "de titel is te lang (max 80 tekens)" };
    if (!doel) return { error: "schrijf wat de kijker moet leren" };
    if (doel.length > 300 || CTRL_RE.test(doel)) return { error: "het doel is te lang (max 300 tekens, één regel)" };
    if (!stappen.length) return { error: "zet minstens één stap in de lijst" };
    if (stappen.length > 12) return { error: "hoogstens 12 stappen per video (maak er anders twee)" };
    if (stappen.some((s) => s.length > 160 || s.includes("|") || CTRL_RE.test(s))) return { error: "een stap is te lang (max 160 tekens) of bevat een |" };
    if (!UITLEG_LEN.includes(+extra.lengte)) return { error: "kies een lengte" };
    if (!UITLEG_FMT.includes(extra.formaat)) return { error: "kies een formaat" };
    if (notitie.length > 300 || CTRL_RE.test(notitie)) return { error: "de notitie is te lang (max 300 tekens, één regel)" };
    let t = "[studio] actie=uitleg titel=" + quote(titel) + " doel=" + quote(doel) + " stappen=" + quote(stappen.join("|")) +
      " lengte=" + (+extra.lengte) + " formaat=" + extra.formaat;
    if (notitie) t += " notitie=" + quote(notitie);
    return { text: t };
  }
  const LOOKS = ["reference_film", "clean_warm", "moody", "daylight", "blue_hour", "vintage"];
  const SOORTEN = ["koken", "kleding", "smoken", "reizen", "klanten", "inbox"];
  const quote = (v) => '"' + String(v).replace(/[\\"]/g, (m) => "\\" + m) + '"';
  const num = (v) => String(Number((+v).toFixed(3)));
  const MAP_RE = /^_?[A-Za-z]+\/[\p{L}\p{N}_ .,'&()\-]{1,120}$/u;
  const CLIP_RE = /^[\w.\- ]{1,120}\.(mp4|mov|mxf|avi)$/i;
  const NAME_RE = /^[\p{L}\p{N}_ .,'&()\-]{1,80}$/u;
  // SSD page requests (webapp/studio.py _parse_ssd): no project; map = "<Soort>/<folder>" as listed in the db.
  function ssdText(action, extra) {
    let t = "[studio] actie=" + action;
    if (action === "ssd-bekijk" || action === "ssd-clip") {
      if (!MAP_RE.test(String(extra.map || ""))) return { error: "map onbekend" };
      t += " map=" + quote(extra.map);
      if (action === "ssd-clip") {
        if (!CLIP_RE.test(String(extra.clip || ""))) return { error: "clip onbekend" };
        t += " clip=" + quote(extra.clip);
      }
    } else if (action === "ssd-verplaats") {
      const name = String(extra.name == null ? "" : extra.name).trim(), maps = Array.isArray(extra.maps) ? extra.maps : [];
      if (!name) return { error: "geef de shoot een naam" };
      if (!NAME_RE.test(name) || name[0] === "." || name[name.length - 1] === ".") return { error: "die naam kan geen mapnaam zijn (geen / \\ : * ? \" < > |)" };
      if (!SOORTEN.includes(extra.soort)) return { error: "kies een soort" };
      if (!maps.length || maps.length > 60) return { error: "vink 1 tot 60 mappen aan" };
      if (!maps.every((m) => MAP_RE.test(String(m)))) return { error: "een map is onbekend" };
      t += " naam=" + quote(name) + " soort=" + extra.soort + " mappen=" + quote(maps.join("|"));

      `<span class="muted">De Studio-sessie draait waarschijnlijk niet. Dubbelklik op start-studio-sessie.bat in je AutoEdit-map, laat het venster open en druk daarna opnieuw op de knop.</span>` +
      `<button class="ghost sm" id="pendClear">Begrepen</button>`;
    $("#pendClear").onclick = () => { S.pending = []; refresh(); };
  }
  // Photos live only in the website (decision 0014): link to it. The Tailscale address works on the PC, the laptop and
  // the phone alike, so it goes first; 127.0.0.1 only reaches the website on the PC itself.
  const site = (u) => (typeof u === "string" && /^https?:\/\/[\w.\-]+(:\d{1,5})?\/?$/.test(u) ? u.replace(/\/$/, "") : "");
  const web = (S.pc && (site(S.pc.phone) || site(S.pc.website))) || "http://127.0.0.1:5080";
  $("#navFotos").href = web + "/#/fotos";
  const busy = S.jobs.filter(running).length;
  const badge = $("#jobBadge"); badge.hidden = !busy; badge.textContent = busy;
  const pcOn = online();
  const pcLabel = !pcOn ? "PC-sessie niet bereikbaar" : late.length ? "PC reageert niet: start de Studio-sessie" : "Klaar voor opdrachten";
  $("#sideStatus").innerHTML = `<div title="${pcLabel}"><span class="dot ${pcOn ? "on" : "off"}"></span><span class="short">PC</span><span class="full">${pcLabel}</span></div>` +
    (seen ? `<div class="full">laatst gezien ${esc(seen)}</div>` : "") +
    (S.pc && S.pc.host ? `<div class="full">${esc(S.pc.host)}</div>` : "") +
    (busy ? `<div title="${busy} ${busy === 1 ? "taak" : "taken"} bezig"><span class="dot busy"></span><span class="short">${busy}</span><span class="full">${busy} ${busy === 1 ? "taak" : "taken"} bezig</span></div>` : "") +
    (pend.length ? `<div title="${esc(pend.map((r) => r.label).join(", "))}"><span class="dot ${late.length ? "off" : "busy"}"></span><span class="short">${pend.length}</span>` +
      `<span class="full">${late.length ? esc(late[0].label) + ": PC reageert niet" : pend.length + " onderweg naar PC"}</span></div>` : "");
}
function short(v) {
  const d = toDate(v);
  if (!d) return "";
  const s = Math.round((Date.now() - d.getTime()) / 1000);
  if (s < 60) return "nu";
  if (s < 3600) return Math.round(s / 60) + " min";
  if (s < 86400) return Math.round(s / 3600) + " u";
  return d.toLocaleDateString("nl-NL", { day: "numeric", month: "short" });
}
let openJob = null;
function jobsStrip(el, projectName) {
  if (!el) return;
  const list = S.jobs.filter((j) => !projectName || j.project === projectName).slice(0, 10);
  el.innerHTML = list.map((j) => {
    const st = jobState(j);
    return `<button class="job ${jobCls(st)}" data-job="${esc(j.id)}" aria-expanded="${openJob === j.id}" title="${esc(j.message || "")}">` +
      `<span class="dot ${st === "klaar" ? "on" : st === "bezig" ? "busy" : "off"}"></span>` +
      `<span>${esc(ACT_NL[j.action] || j.action || "taak")}${projectName ? "" : " · " + esc(j.project || "")} · ${esc(JOB_NL[st])}` +
      ` · ${esc(ago(j.finished_at || j.started_at))}</span></button>`;
  }).join("");
  const msgEl = el.nextElementSibling && el.nextElementSibling.classList.contains("jobmsg") ? el.nextElementSibling : null;
  const job = list.find((j) => j.id === openJob);
  if (msgEl) {

    msgEl.innerHTML = job ? `<pre class="out">${esc(job.message || "Nog geen bericht van de PC.")}</pre>` : "";

  el.querySelectorAll("[data-job]").forEach((b) => (b.onclick = () => {
    openJob = openJob === b.dataset.job ? null : b.dataset.job; jobsStrip(el, projectName);
  }));
}

let view = null;                                // {key, update()}
function route() {
  const [, top = "", id = "", tab = "grade"] = location.hash.split("/").map((s) => { try { return decodeURIComponent(s); } catch (e) { return ""; } });
  const key = top === "p" ? "p/" + id + "/" + tab : top === "juict" ? "juict/" + id : top === "ssd" ? "ssd" : top;
  document.querySelectorAll("nav a").forEach((a) => a.classList.toggle("on", a.dataset.nav === (["instellingen", "ssd", "juict", "prompt", "instructies"].includes(top) ? top : top === "taken" ? "instellingen" : "home")));
  if (view && view.key === key) return view.update(id);
  if (view && view.destroy) view.destroy();
  view = top === "p" ? projectView(id, tab) : top === "taken" || top === "instellingen" ? jobsView() : top === "ssd" ? ssdView() : top === "juict" ? (id ? juictVideoView(id) : juictDash()) : top === "prompt" ? promptView() : top === "instructies" ? docsView(id) : homeView();
  view.key = key;
  view.update(id);
}
function render() { renderShell(); route(); }

function makeChat(el, opts) {
  let turns = (store.get(opts.key) || []).filter((t) => t && (t.role === "user" || t.role === "assistant") && typeof t.content === "string").slice(-20);
  let ctl = null, live = "", busy = false, dead = "";
  el.innerHTML = `<div class="chat">
    <div class="chat-log" aria-live="polite"></div>
    <div class="chat-chips"></div>
    <form class="chat-in"><textarea rows="1" placeholder="${esc(opts.placeholder)}" aria-label="${esc(opts.placeholder)}"></textarea>
      <button type="submit" class="send">Stuur</button><button type="button" class="ghost stop" hidden>Stop</button></form>
    <div class="chat-foot"><span class="why"></span><span class="spacer"></span><button type="button" class="ghost sm reset">Nieuw gesprek</button></div></div>`;
  const log = $(".chat-log", el), box = $("textarea", el), why = $(".chat-foot .why", el);
  const save = () => store.set(opts.key, turns.slice(-20));
  function paint() {
    const msgs = turns.map((t) => t.role === "user" ? `<div class="msg me">${inlineMd(t.content).replace(/\n/g, "<br>")}</div>`
      : `<div class="msg ai">${renderAnswer(t.content, !!opts.make)}</div>`);
    if (busy) msgs.push(`<div class="msg ai">${live ? renderAnswer(live) : '<span class="thinking">Denkt na…</span>'}</div>`);
    log.innerHTML = msgs.length ? msgs.join("") : `<div class="chat-intro">${opts.intro}</div>`;
    log.querySelectorAll("[data-copy]").forEach((b) => (b.onclick = () => copyText(b.closest(".pbox").querySelector("pre").textContent, b)));
    log.querySelectorAll("[data-make]").forEach((b) => (b.onclick = () => makeForm(b.closest(".pbox"))));
    $(".chat-chips", el).innerHTML = !turns.length && !busy ? opts.chips.map(([l], i) => `<button type="button" class="chip-s" data-chip="${i}">${esc(l)}</button>`).join("") : "";
    el.querySelectorAll("[data-chip]").forEach((b) => (b.onclick = () => ask(opts.chips[+b.dataset.chip][1])));
    log.scrollTop = log.scrollHeight;
    $(".send", el).hidden = busy; $(".stop", el).hidden = !busy;
    $(".send", el).disabled = !!dead; box.disabled = !!dead;
    why.textContent = dead;
  }
  async function ask(text) {
    text = String(text || "").trim();
    if (!text || busy || dead) return;
    const sample = await claude_use("sample");
    if (!sample) { dead = "De chat werkt alleen als je deze pagina in Claude opent."; paint(); return; }
    turns.push({ role: "user", content: text.slice(0, 4000) }); save();
    box.value = ""; autosize(); busy = true; live = ""; paint();
    ctl = new AbortController();
    try {
      const { text: answer, truncated } = await sample([{ role: "user", content: opts.rules() }, ...turns.slice(-16)], {
        cache: false, signal: ctl.signal, modelTier: opts.tier, onText: ({ text: t }) => { live = t; paint(); },
      });
      turns.push({ role: "assistant", content: answer + (truncated ? "\n\n(afgekapt)" : "") });
    } catch (e) {
      const keep = e && e.code !== "refused" && e.text;
      if (keep) turns.push({ role: "assistant", content: e.text + "\n\n(onderbroken)" });
      if (e && HIDE_CODES.includes(e.code)) dead = SAMPLE_ERR[e.code];
      else if (e && e.code !== "cancelled") toast(SAMPLE_ERR[e.code] || "Verbinding met Claude mislukt. Probeer het nog eens.", "err");
    } finally {
      busy = false; live = ""; ctl = null; save(); paint();
    }
  }
  const autosize = () => { box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight, 180) + "px"; };
  box.oninput = autosize;
  box.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(box.value); } };
  $("form", el).onsubmit = (e) => { e.preventDefault(); ask(box.value); };
  $(".stop", el).onclick = () => ctl && ctl.abort();
  $(".reset", el).onclick = () => { if (ctl) ctl.abort(); turns = []; save(); paint(); box.focus(); };
  paint();
  return { destroy() { if (ctl) ctl.abort(); } };
}

    <button class="vadd" data-add="${esc(v.id)}" title="Aan montage toevoegen" aria-label="${esc(v.titel)} aan montage toevoegen">+</button>
    <div class="vthumb">${ref ? `<video src="${esc(ref.url)}#t=3" muted preload="metadata" playsinline tabindex="-1"></video>`
      : `<span class="vt-n">${esc(v.label || "Video")}</span>`}<span class="vt-play" aria-hidden="true"></span>

}

// --- montage: an ordered list of fragments (a whole video or one of its scenes), kept in db juict_montage/main
// {items: [{v: videoId, s: sceneIndex | -1}], at}. "Naar DaVinci Resolve" sends one juict-montage request.
const MONT_MAX = 60;
function montageSave(items) {
  const ab = (it) => (Number.isFinite(it.a) && Number.isFinite(it.b) && it.b > it.a ? { a: Math.round(it.a * 1000) / 1000, b: Math.round(it.b * 1000) / 1000 } : {});
  const data = { items: items.slice(0, MONT_MAX).map((it) => ({ v: it.v, s: Number.isInteger(it.s) ? it.s : -1, ...ab(it) })), at: new Date().toISOString() };
  S.jmontage = data;
  if (S.db && S.owner !== false) return S.db.doc("juict_montage/main").set(data).catch((e) => toast("Montage niet opgeslagen (" + (e && e.code || "fout") + ").", "err"));
  return Promise.resolve();
}
function montageAdd(it) {
  const items = montageItems();
  if (items.length >= MONT_MAX) return toast("Hoogstens " + MONT_MAX + " fragmenten.", "err");
  items.push(it); montageSave(items); refresh();
  toast("Toegevoegd aan de montage (" + items.length + ").", "ok");
}
function montageItems() {
  const d = obj(S.jmontage), raw = d && Array.isArray(d.items) ? d.items : [];
  return raw.map(obj).filter((it) => it && typeof it.v === "string" && ID_RE.test(it.v)).slice(0, MONT_MAX)
    .map((it) => { const o = { v: it.v, s: Number.isInteger(it.s) ? it.s : -1 };
      if (Number.isFinite(it.a) && Number.isFinite(it.b) && it.a >= 0 && it.b > it.a && it.b <= 3600) { o.a = it.a; o.b = it.b; }
      return o; });
}
function fragment(it) {
  const vid = juictVideo(it.v);
  if (!vid) return null;
  if (Number.isFinite(it.a) && Number.isFinite(it.b) && it.b > it.a) {          // in/out set on the timeline
    const sc = it.s >= 0 && vid.scenes[it.s], sb = sc ? sceneBounds(vid, it.s) : [0, vidDur(vid)];
    const exact = Math.abs(sb[0] - it.a) < 0.02 && Math.abs(sb[1] - it.b) < 0.02;
    return { vid, start: it.a, dur: Math.round((it.b - it.a) * 1000) / 1000, custom: !exact,
      name: exact ? (sc ? sc.name : "hele video") : (sc ? sc.name + " (geknipt)" : "knip " + clock(it.a) + "–" + clock(it.b)) };
  }
  if (it.s >= 0 && vid.scenes[it.s]) {
    const start = vid.scenes.slice(0, it.s).reduce((a, x) => a + x.dur, 0);
    return { vid, start, dur: vid.scenes[it.s].dur, name: vid.scenes[it.s].name };
  }
  return { vid, start: 0, dur: vid.dur, name: "hele video" };
}
function montagePanel(el) {
  let items = montageItems(), saving = Promise.resolve(), dropAt = -1, key = null;
  const history = [];                                   // undo stack of earlier item lists (this page view)
  el.innerHTML = `<div class="why" style="margin:-6px 0 10px">Sleep video's hierheen (of druk op + op een kaart). Knippen en trimmen doe je in de editor: klik op een video.</div>
    <div class="mont-list" id="mList" aria-label="Montage"></div>
    <div class="row mont-foot"><span class="muted small" id="mTotal"></span><span class="spacer"></span>
      <button class="ghost sm" id="mUndo" title="Ongedaan maken (Ctrl+Z)">↶</button>
      <button class="ghost sm" id="mClear">Leegmaken</button><button class="dark sm" id="mPlay">▶ Afspelen</button><button class="sm" data-pc id="mGo">Naar DaVinci Resolve</button></div>
    <div class="why" id="mWhy"></div>
    <div class="mprev" id="mPrev" hidden><video playsinline preload="auto"></video>
      <div class="row small muted"><span id="mNow"></span><span class="spacer"></span><button class="ghost sm" id="mStop">Stop</button></div></div>`;
  const list = $("#mList", el);
  let last = JSON.stringify(items);
  const save = () => {
    history.push(JSON.parse(last)); if (history.length > 50) history.shift();
    last = JSON.stringify(items);
    saving = saving.then(() => montageSave(items));
    key = null; paint();
  };
  const undo = () => {
    if (!history.length) return toast("Niets om ongedaan te maken.");
    items = history.pop(); last = JSON.stringify(items); saving = saving.then(() => montageSave(items)); key = null; paint();
    toast("Ongedaan gemaakt.", "ok");
  };
  function paint() {
    const k = JSON.stringify([items, dropAt, online(), [...S.jvideo.keys()], juictVideos().length]);
    if (k === key) return;
    key = k;
    const frags = items.map(fragment);
    const rows = items.map((it, i) => {
      const f = frags[i];
      if (!f) return `<div class="mrow gone" data-i="${i}"><span class="mi">${i + 1}</span><span class="nm">Video niet meer gevonden</span><button class="ghost sm" data-del="${i}" aria-label="Weghalen">✕</button></div>`;
      const cut = f.custom ? `<option value="c" selected>${esc(f.name)} · ${f.dur} s</option>` : "";
      const opts = [cut + `<option value="-1"${it.s < 0 && !f.custom ? " selected" : ""}>Hele video${f.vid.dur ? " · " + f.vid.dur + " s" : ""}</option>`]
        .concat(f.vid.scenes.map((sc, j) => `<option value="${j}"${it.s === j && !f.custom ? " selected" : ""}>${j + 1}. ${esc(sc.name)} · ${sc.dur} s</option>`)).join("");
      return `<div class="mrow${dropAt === i ? " drop-before" : ""}${vidRef(f.vid.id) ? "" : " no-mp4"}" draggable="true" data-i="${i}">
        <span class="grip" aria-hidden="true">⋮⋮</span><span class="mi">${i + 1}</span>
        <span class="mtxt"><span class="nm">${esc(fullTitle(f.vid))}</span>
          <select data-scene="${i}" aria-label="Fragment van ${esc(f.vid.titel)}"${f.vid.scenes.length ? "" : " disabled"}>${opts}</select></span>
        <button class="ghost sm" data-dup="${i}" title="Nog een keer gebruiken" aria-label="Dupliceren">⧉</button>
        <button class="ghost sm" data-del="${i}" title="Weghalen" aria-label="Weghalen">✕</button></div>`;
    });
    list.innerHTML = rows.length ? rows.join("") + `<div class="mdrop${dropAt === items.length ? " on" : ""}" data-i="${items.length}">Sleep hier nog een video</div>`
      : `<div class="mdrop empty-drop${dropAt === 0 ? " on" : ""}" data-i="0">Sleep een video hierheen</div>`;
    const total = frags.reduce((a, f) => a + (f ? f.dur : 0), 0);
    $("#mTotal", el).textContent = items.length ? items.length + (items.length === 1 ? " fragment" : " fragmenten") + " · " + total + " s" : "";
    $("#mClear", el).hidden = !items.length;
    $("#mUndo", el).hidden = !history.length;
    $("#mPlay", el).disabled = !frags.some((f) => f && vidRef(f.vid.id));
    const missing = frags.filter((f) => f && !vidRef(f.vid.id)).map((f) => f.vid.label || f.vid.titel);
    const r = montageRequest();
    $("#mGo", el).dataset.block = r.error ? "1" : "";
    $("#mWhy", el).textContent = !items.length ? "" : missing.length ? "Nog geen MP4: " + [...new Set(missing)].join(", ") + "."
      : !online() ? offlineReason() : r.error || "Eén tijdlijn met deze fragmenten achter elkaar, markers per fragment, sporen SFX en Muziek.";
    $("#mWhy", el).className = "why" + (items.length && (missing.length || !online()) ? " warn" : "");
    pcButtons(el);
  }
  function montageRequest() {
    const parts = [];
    for (const it of items) {
      const f = fragment(it), ref = f && vidRef(f.vid.id);
      if (!f || !ref || !ref.asset) return { error: "elke video in de montage heeft een MP4 nodig" };
      parts.push({ asset: ref.asset, start: f.start, dur: f.dur || 0, name: fullTitle(f.vid) + (it.s >= 0 ? " – " + f.name : "") });
    }
    return requestText("juict-montage", "", { parts });
  }
  const at = (e) => { const row = e.target.closest && e.target.closest("[data-i]"); if (!row) return items.length;
    const i = +row.dataset.i; if (row.classList.contains("mdrop")) return i;
    const r = row.getBoundingClientRect(); return e.clientY > r.top + r.height / 2 ? i + 1 : i; };
  list.addEventListener("dragstart", (e) => {
    const row = e.target.closest && e.target.closest(".mrow[draggable]"); if (!row) return;
    e.dataTransfer.setData("application/x-juict", JSON.stringify({ from: +row.dataset.i }));
    e.dataTransfer.effectAllowed = "move";
  });
  list.addEventListener("dragover", (e) => {
    if (![...e.dataTransfer.types].includes("application/x-juict")) return;
    e.preventDefault();
    const i = at(e); if (i !== dropAt) { dropAt = i; key = null; paint(); }
  });
  list.addEventListener("dragleave", (e) => { if (!list.contains(e.relatedTarget)) { dropAt = -1; key = null; paint(); } });
  list.addEventListener("drop", (e) => {
    e.preventDefault();
    let d = null; try { d = JSON.parse(e.dataTransfer.getData("application/x-juict")); } catch (err) { d = null; }
    let i = at(e); dropAt = -1;
    if (d && Number.isInteger(d.from) && items[d.from]) {
      const [moved] = items.splice(d.from, 1); if (d.from < i) i--; items.splice(i, 0, moved); save();
    } else if (d && typeof d.v === "string" && juictVideo(d.v)) {
      if (items.length >= MONT_MAX) return toast("Hoogstens " + MONT_MAX + " fragmenten.", "err");
      items.splice(i, 0, { v: d.v, s: -1 }); save();
    } else { key = null; paint(); }
    document.body.classList.remove("dragging");
  });
  list.addEventListener("change", (e) => { const sel = e.target.closest("[data-scene]"); if (!sel) return; if (sel.value === "c") return; const i = +sel.dataset.scene; items[i] = { v: items[i].v, s: +sel.value }; save(); });
  list.addEventListener("click", (e) => {
    const dup = e.target.closest("[data-dup]"), del = e.target.closest("[data-del]");
    if (dup) { if (items.length >= MONT_MAX) return toast("Hoogstens " + MONT_MAX + " fragmenten.", "err"); const i = +dup.dataset.dup; items.splice(i + 1, 0, { ...items[i] }); save(); }
    if (del) { items.splice(+del.dataset.del, 1); save(); }
  });
  $("#mClear", el).onclick = () => { items = []; save(); toast("Montage leeg. Ctrl+Z zet hem terug."); };
  $("#mUndo", el).onclick = undo;
  // live preview: play the fragments one after another from their MP4s, in this page (no Resolve needed)
  const pv = $("#mPrev video", el); let seq = [], pos = 0;
  const playAt = (i) => {
    pos = i;
    if (i >= seq.length) { $("#mNow", el).textContent = "Klaar · " + seq.length + " fragmenten"; return; }
    const f = seq[i];
    $("#mNow", el).textContent = (i + 1) + "/" + seq.length + " · " + fullTitle(f.vid) + (f.name !== "hele video" ? " – " + f.name : "");
    const go = () => { pv.currentTime = f.start; pv.play().catch(() => {}); };
    if (pv.getAttribute("src") !== f.url) { pv.src = f.url; pv.onloadedmetadata = go; } else go();
    list.querySelectorAll(".mrow").forEach((r) => r.classList.toggle("playing", +r.dataset.i === f.i));
  };
  pv.ontimeupdate = () => { const f = seq[pos]; if (f && f.dur && pv.currentTime >= f.start + f.dur - 0.05) playAt(pos + 1); };
  pv.onended = () => playAt(pos + 1);
  $("#mPlay", el).onclick = () => {
    seq = items.map((it, i) => { const f = fragment(it), r = f && vidRef(f.vid.id); return r ? { ...f, url: r.url, i } : null; }).filter(Boolean);
    if (!seq.length) return toast("Nog geen fragmenten met een MP4.", "err");
    const skipped = items.length - seq.length;
    if (skipped) toast(skipped + " fragment(en) zonder MP4 overgeslagen.");
    $("#mPrev", el).hidden = false; playAt(0);
  };
  $("#mStop", el).onclick = () => { pv.pause(); $("#mPrev", el).hidden = true; list.querySelectorAll(".mrow.playing").forEach((r) => r.classList.remove("playing")); };
  const onKey = (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); undo(); }
  };
  document.addEventListener("keydown", onKey);
  $("#mGo", el).onclick = (e) => { const r = montageRequest(); if (r.error) return toast(r.error, "err"); sendText(e.currentTarget, "juict-montage", r.text); };
  paint();
  return {
    add(it) { if (items.length >= MONT_MAX) return toast("Hoogstens " + MONT_MAX + " fragmenten.", "err"); items.push(it); save(); toast("Toegevoegd aan de montage (" + items.length + ").", "ok"); },
    update() { const fresh = montageItems(); if (JSON.stringify(fresh) !== JSON.stringify(items) && dropAt < 0) { items = fresh; last = JSON.stringify(items); } paint(); },
    clearDrop() { if (dropAt >= 0) { dropAt = -1; key = null; paint(); } },
    destroy() { document.removeEventListener("keydown", onKey); pv.pause(); },
  };
}

// ------------------------------------------------------------------ JUICT: werkinstructies (PDF)
// PDFs go straight into the artifact's asset store (no PC, no Claude turn); db juict_docs/<id>
// {titel, name, asset, ref, size, at, video?, serie?}. Only the owner uploads, renames and deletes.
const DOC_MAX = 20 * 1024 * 1024;
const fmtSize = (b) => (b >= 1048576 ? (b / 1048576).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(b / 1024)) + " kB");
function docList() {
  return [...S.jdocs.entries()].filter(([id]) => /^[a-z0-9-]{1,40}$/.test(id)).map(([id, d]) => ({
    id, titel: str(d.titel).slice(0, 120) || str(d.name) || "Werkinstructie", name: str(d.name).slice(0, 160),
    ref: safeUrl(d.ref), asset: /^[0-9a-f]{8,64}$/.test(str(d.asset)) ? d.asset : "", size: +d.size || 0, at: d.at,
    video: str(d.video), serie: str(d.serie).slice(0, 60),
  })).filter((d) => d.ref).sort((a, b) => (toDate(b.at)?.getTime() || 0) - (toDate(a.at)?.getTime() || 0));
}
const docTitle = (name) => String(name).replace(/\.pdf$/i, "").replace(/[_-]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 120) || "Werkinstructie";
// PDF preview: pdf.js draws the pages on canvases (the viewer's sandbox shows no built-in PDF viewer in a frame).
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfjsP = null;
const loadPdfjs = () => pdfjsP || (pdfjsP = new Promise((res, rej) => {
  if (window.pdfjsLib) return res(window.pdfjsLib);
  const sc = document.createElement("script"); sc.src = PDFJS + "pdf.min.js";
  sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; res(window.pdfjsLib); };
  sc.onerror = () => { pdfjsP = null; rej(new Error("pdf.js niet geladen")); };
  document.head.append(sc);
}));
let pdfRun = 0;
async function renderPdf(url, box, why) {
  const run = ++pdfRun;
  try {
    const lib = await loadPdfjs();
    const data = await (await fetch(url)).arrayBuffer();
    if (run !== pdfRun) return;
    const doc = await lib.getDocument({ data }).promise;
    box.innerHTML = "";
    const n = Math.min(doc.numPages, 40), w = Math.max(320, box.clientWidth - 24);
    for (let i = 1; i <= n; i++) {
      if (run !== pdfRun) return;
      const page = await doc.getPage(i), vp0 = page.getViewport({ scale: 1 });
      const scale = (w / vp0.width) * Math.min(2, window.devicePixelRatio || 1), vp = page.getViewport({ scale });
      const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height; c.className = "pdf-page";
      box.append(c);
      await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    }
    why.textContent = doc.numPages + (doc.numPages === 1 ? " pagina" : " pagina's") + (doc.numPages > n ? " (eerste " + n + " getoond: download voor de rest)" : "");
  } catch (e) {
    if (run !== pdfRun) return;
    box.innerHTML = `<div class="empty" style="margin:16px">Voorbeeld niet beschikbaar. Gebruik <b>Downloaden</b> en open de PDF op je computer.</div>`;
    why.textContent = "";
  }
}
function docsView(openId) {

// Media Pool | Viewer (Bron / Tijdlijn) | Inspector; timeline below; page bar at the bottom. The timeline IS the montage

// first-frame thumbnails and audio waveforms, both read from the MP4 in the page (same origin, so canvases stay clean)
const THUMB = new Map(), PEAKS = new Map();
let thumbChain = Promise.resolve();
function frameThumb(vidId, t) {
  const r = vidRef(vidId); if (!r) return Promise.resolve(null);
  const k = vidId + "@" + t.toFixed(2);
  if (THUMB.has(k)) return THUMB.get(k);
  const p = (thumbChain = thumbChain.then(() => new Promise((res) => {
    const el = document.createElement("video"); el.muted = true; el.preload = "auto"; el.src = r.url;
    const done = (v) => { el.removeAttribute("src"); el.load(); res(v); };
    const timer = setTimeout(() => done(null), 8000);
    el.onloadedmetadata = () => { MEDIA_DUR.set(vidId, el.duration); el.currentTime = Math.min(Math.max(0, t + 0.05), Math.max(0, el.duration - 0.05)); };
    el.onseeked = () => { try { const c = document.createElement("canvas"); c.width = 160; c.height = 90; c.getContext("2d").drawImage(el, 0, 0, 160, 90);
      clearTimeout(timer); done(c.toDataURL("image/jpeg", 0.7)); } catch (e) { clearTimeout(timer); done(null); } };
    el.onerror = () => { clearTimeout(timer); done(null); };
  })));
  THUMB.set(k, p);
  return p;
}
function peaksOf(vidId) {
  const r = vidRef(vidId); if (!r) return Promise.resolve(null);
  if (PEAKS.has(vidId)) return PEAKS.get(vidId);
  const p = (async () => {
    try {
      const buf = await (await fetch(r.url)).arrayBuffer();
      const ctx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 44100, 44100);
      const audio = await ctx.decodeAudioData(buf);
      const ch = audio.getChannelData(0), per = Math.max(1, Math.floor(audio.sampleRate / 50)), out = new Float32Array(Math.ceil(ch.length / per));
      for (let i = 0; i < out.length; i++) { let m = 0; for (let j = i * per, e = Math.min(ch.length, j + per); j < e; j++) { const v = Math.abs(ch[j]); if (v > m) m = v; } out[i] = m; }
      let mx = 0.0001; for (const v of out) if (v > mx) mx = v;
      for (let i = 0; i < out.length; i++) out[i] /= mx;
      return out;                                       // 50 peaks per second, 0..1
    } catch (e) { return null; }
  })();
  PEAKS.set(vidId, p);
  return p;
}
function montageRequestOf(items) {
  if (!items.length) return { error: "de tijdlijn is leeg" };
  const parts = [];
  for (const it of items) {
    const f = fragment(it), ref = f && vidRef(f.vid.id);
    if (!f || !ref || !ref.asset) return { error: "elke video op de tijdlijn heeft een MP4 nodig" };
    parts.push({ asset: ref.asset, start: f.start, dur: f.dur || 0, name: fullTitle(f.vid) + " – " + f.name });
  }
  return requestText("juict-montage", "", { parts });
}

  const timeAt = (clientX) => { const r = lanes.getBoundingClientRect(); return Math.max(0, (clientX - r.left) / pps()); };

      else { lanesKey = ""; paintLanes(); }
    };
    addEventListener("pointermove", mv); addEventListener("pointerup", up);
  });
  scroll.addEventListener("wheel", (e) => {
    if (!(e.ctrlKey || e.metaKey)) return; e.preventDefault();
    const p0 = pps(), mouseT = timeAt(e.clientX); E.fit = false; E.pps = Math.max(2, Math.min(600, p0 * (e.deltaY < 0 ? 1.2 : 1 / 1.2)));
    lanesKey = ""; paintLanes(); scroll.scrollLeft += mouseT * (E.pps - p0);

    if (ctrl || e.altKey) return;

    else if (k === "l" || k === "L") { if (playing()) { E.rate = Math.min(4, E.rate * 2); vid.playbackRate = E.rate; } else togglePlay(); }
    else if (k === "j" || k === "J") step(-1);
    else if (k === "ArrowLeft") { e.preventDefault(); step(e.shiftKey ? -1 : -1 / FPS); }

// ------------------------------------------------------------------ project
// ------------------------------------------------------------------ project portal in Resolve's layout: Edit · Color · Deliver
// One page per project with a page bar like Resolve. Fewer steps (decision 0015): the grade is optional (house look),
// "Ja, renderen" records the approval of the current plan and renders, in one press (a chain of PC requests).
// Color page = Resolve's Color page: Gallery (one still per look) · Viewer (with wipe) · Nodes (the engine's real pipeline:
// exposure → conversion → look → key mix) · clip strip (the 4 example shots) · Primaries (exposure = offset, strength =
// key output) · Scopes (parade / waveform / vectorscope, read from the viewer's pixels).
const PAGE_OF = { grade: "color", plan: "edit", goedkeuren: "deliver", renderen: "deliver", resultaat: "deliver", edit: "edit", color: "color", deliver: "deliver" };
const LOOK_NL = { reference_film: "Film", clean_warm: "Warm helder", moody: "Moody", daylight: "Daglicht", blue_hour: "Blauw uur", vintage: "Vintage" };
const IMG = new Map();
const loadImg = (url) => IMG.get(url) || (IMG.set(url, new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = url; })), IMG.get(url));
// the look previews are 4 shots side by side, separated by thin black bars: shot k of an image
const shotRect = (im, k) => { const gap = Math.round(im.width * 0.0031), w = (im.width - 3 * gap) / 4; return [k * (w + gap), 0, w, im.height]; };
const APPROVE_NOTE = "Ja, renderen (knop in de Studio)";
function nextStep(p) {
  const a = p.approval, ok = !!(a && a.status === "approved" && a.current && a.grade_current);
  if (!p.plan) return { act: "plan", label: "Plan maken", page: "edit" };
  if (!p.render || !ok) return { act: "chain", label: "Ja, renderen", page: "deliver" };
  return { act: "view", label: "Bekijk de render", page: "deliver", done: true };
}
// "Ja, renderen": grade (house look if none) → approval of this plan → render. One step per PC answer.
function runChain(p, btn) {
  const c = S.chain; if (!c || c.pid !== p.id || !btn) return;
  if (S.jobs.some((j) => running(j) && j.project === p.name)) return;                 // wait for the PC
  if (Date.now() - (c.sentAt || 0) < 4000) return;
  const g = p.grade || {}, a = p.approval;
  const graded = gradeChosen(p) && /^[0-9a-f]{12}$/.test(String(g.key || ""));
  const approved = !!(a && a.status === "approved" && a.current && a.grade_current);
  let step = null, extra = null;
  if (!graded) { step = "grade"; extra = { look: g.look || "reference_film", strength: Number.isFinite(+g.strength) ? +g.strength : 1, exposure: Number.isFinite(+g.exposure) ? +g.exposure : -1.75 }; }
  else if (!approved) { step = "goedkeuren"; extra = { plan: p.plan && p.plan.edl_sha1, grade: g.key, note: APPROVE_NOTE }; }
  else if (!c.rendered) { step = "render"; }
  else { S.chain = null; toast("Render gestart: je ziet hem bij Deliver als hij klaar is.", "ok"); return; }
  if (c.last === step && c.tries >= 2) { S.chain = null; toast("Ja, renderen gestopt: " + (ACT_NL[step] || step) + " lukte niet. Zie Instellingen → Activiteit.", "err"); return; }
  c.tries = c.last === step ? (c.tries || 0) + 1 : 1; c.last = step; c.sentAt = Date.now();
  if (step === "render") c.rendered = true;
  send(btn, step, p, extra).then((sent) => { if (!sent) S.chain = null; });
}

      <div class="row"><button data-pc id="planBtn">Plan maken</button><button class="dark" data-pc id="prevBtn">Voorbeeld</button></div>
      <div class="confirm" id="confirm" hidden><span>Je huidige goedkeuring vervalt met een nieuw plan. Toch een nieuw plan maken?</span>
        <div class="row"><button data-pc id="planYes">Ja, nieuw plan</button><button class="ghost" id="planNo">Annuleren</button></div></div>
      <div class="why" id="pwhy"></div></div></div>
    <div class="card review" id="sheet" style="margin-top:16px" hidden><h2>Storyboard</h2><div class="why" id="sheetMw"></div><img alt="Storyboard van het plan"></div>
    <div class="card" id="pvid" style="margin-top:16px" hidden><h2>Voorbeeldvideo</h2><div class="why" id="pvMw"></div><video controls preload="metadata" playsinline></video></div>`;
  let P = null;
  const D = () => draft(id, project(id));
  const showConfirm = (on) => { D().confirmPlan = on; $("#confirm", el).hidden = !on; $("#planBtn", el).hidden = on; };
  $("#planBtn", el).onclick = (e) => { if (P.approval && P.approval.status === "approved") return showConfirm(true); send(e.currentTarget, "plan", P); };
  $("#planYes", el).onclick = (e) => { send(e.currentTarget, "plan", P).then(() => showConfirm(false)); };
  $("#planNo", el).onclick = () => showConfirm(false);
  $("#prevBtn", el).onclick = (e) => send(e.currentTarget, "preview", P);
  return {
    update(p) {
      P = p;
      const pl = p.plan;
      const sh = pl ? +pl.shots || 0 : 0, du = pl ? +pl.duration || 0 : 0, f1 = (v) => v.toFixed(1).replace(".", ",");
      $("#pinfo", el).innerHTML = pl ? `<div class="specs"><div><span>Shots</span><b>${sh}</b></div>` +
          `<div><span>Duur</span><b>${f1(du)} s</b></div><div><span>Per shot</span><b>${sh ? f1(du / sh) + " s" : "—"}</b></div></div>
          <dl class="kv" style="margin-top:14px"><dt>Titel</dt><dd>${esc(pl.title || "—")}</dd>
          <dt>Plan-code</dt><dd class="mono">${esc(pl.edl_sha1 || "—")}</dd></dl>`
        : '<div class="muted">Nog geen plan. Plan maken kiest de shots en maakt een storyboard op je PC.</div>';
      const sheet = pl && safeUrl(pl.sheet_url);
      $("#sheet", el).hidden = !sheet;
      if (sheet && $("#sheet img", el).getAttribute("src") !== sheet) $("#sheet img", el).src = sheet;
      const pv = pl && safeUrl(pl.preview_url);
      $("#pvid", el).hidden = !pv;
      if (pv && $("#pvid video", el).getAttribute("src") !== pv) $("#pvid video", el).src = pv;
      for (const [which, sel] of [["sheet", "#sheetMw"], ["preview", "#pvMw"]]) {
        const m = madeWith(p, which);
        $(sel, el).textContent = m ? m.text : "";
        $(sel, el).className = "why" + (m && m.stale ? " warn" : "");
      }
      $("#prevBtn", el).dataset.block = pl ? "" : "1";
      showConfirm(D().confirmPlan);
      $("#pwhy", el).textContent = online() ? (pl ? "Voorbeeld rendert een snelle versie op halve grootte." : "Voorbeeld kan pas als er een plan is.") : offlineReason();
      $("#pwhy", el).className = "why" + (online() ? "" : " warn");
      pcButtons(el);
    },
  };
}

// ---------------------------------------------------------- tab: goedkeuren
function approveTab(el, id) {
  el.innerHTML = `<div class="grid cols-2">
    <div class="card stack"><h2 style="margin:0">Wat je goedkeurt</h2><div class="banner" id="astate"></div><div id="ainfo"></div></div>
    <div class="card stack"><h2 style="margin:0">Goedkeuren</h2>
      <label>Wat keur je goed (in je eigen woorden)<input type="text" id="note" maxlength="300" autocomplete="off" placeholder="bijv. ja, render zo, titel is goed"></label>
      <div class="row"><button data-pc id="okBtn">Goedkeuren</button><span class="muted small" id="count"></span></div>
      <div class="why" id="awhy"></div></div></div>`;
  let P = null;
  const D = () => draft(id, project(id));
  const input = $("#note", el);
  input.value = D().note;
  const check = () => {
    const g = P && P.grade || {};
    return requestText("goedkeuren", P ? P.name : "", { plan: P && P.plan && P.plan.edl_sha1, grade: g.key, note: input.value });
  };
  function state() {
    if (!P) return;
    const r = check(), empty = !input.value.trim();
    $("#okBtn", el).dataset.block = r.error ? "1" : "";
    $("#count", el).textContent = input.value.length ? input.value.length + " / 300" : "";
    const why = !online() ? offlineReason() : empty ? "Schrijf eerst in je eigen woorden wat je goedkeurt." : r.error || "Je keurt het plan en de opgeslagen grade hiernaast samen goed.";
    $("#awhy", el).textContent = why;
    $("#awhy", el).className = "why" + (!online() || (!empty && r.error) ? " warn" : "");
    pcButtons(el);
  }
  input.oninput = () => { D().note = input.value; state(); };
  $("#okBtn", el).onclick = (e) => {
    const r = check();
    if (r.error) return toast(r.error, "err");
    send(e.currentTarget, "goedkeuren", P, { plan: P.plan.edl_sha1, grade: P.grade.key, note: input.value }).then((ok) => {
      if (ok) { input.value = ""; D().note = ""; state(); }
    });
  };
  return {
    update(p) {
      P = p;
      const st = approvalState(p), a = p.approval, g = p.grade || {}, d = D();
      $("#astate", el).className = "banner " + st.cls;
      $("#astate", el).innerHTML = esc(st.text) + (a && a.status === "approved" && (a.by || a.at) ? `<br><span class="muted small">door ${esc(a.by || "?")}${a.at ? " · " + esc(when(a.at)) : ""}</span>` : "");
      const tryOther = g.look != null && (g.look !== d.look || Math.abs(+g.strength - d.strength) > 0.004 || Math.abs(+g.exposure - d.exposure) > 0.004);
      const sheet = p.plan && safeUrl(p.plan.sheet_url);
      $("#ainfo", el).innerHTML = (sheet ? `<img class="mini-sheet" src="${esc(sheet)}" alt="Storyboard van het plan" style="margin-bottom:14px">` : "") +
        `<dl class="kv"><dt>Plan</dt><dd>${p.plan ? `<span class="mono">${esc(p.plan.edl_sha1 || "—")}</span> · ${+p.plan.shots || 0} shots` : "nog geen plan"}</dd>
        <dt>Grade</dt><dd>${g.look != null ? `<i class="sw look-${esc(g.look)}" aria-hidden="true"></i>${esc(lookName(g.look))} · ${esc(pct(g.strength))} · ${esc(stops(g.exposure))}` : "onbekend"}</dd></dl>` +
        (tryOther ? `<div class="why warn" style="margin-top:8px">Je hebt bij Grade een andere grade geprobeerd maar niet gekozen. Je keurt de opgeslagen grade goed.</div>` : "");
      state();
    },
  };
}

// ---------------------------------------------------------- tab: renderen
function renderTab(el, id) {
  el.innerHTML = `<div class="grid cols-2">
    <div class="card stack"><h2 style="margin:0">Renderen</h2><ul class="gates" id="gates" aria-label="Wat er klaar moet zijn"></ul>
      <div class="row"><button data-pc id="renderBtn">Renderen</button><button class="dark" data-pc id="qaBtn">QA</button></div>
      <div class="why" id="rwhy"></div></div>
    <div class="card"><h2>Laatste render</h2><div id="rinfo"></div></div></div>`;
  let P = null;
  $("#renderBtn", el).onclick = (e) => send(e.currentTarget, "render", P);
  $("#qaBtn", el).onclick = (e) => send(e.currentTarget, "qa", P);
  return {
    update(p) {
      P = p;
      const a = p.approval, g = p.grade || {}, approved = !!(a && a.status === "approved");
      const ready = !!(a && a.current && a.grade_current);
      const rendering = S.jobs.some((j) => j.project === p.name && j.action === "render" && running(j));
      const gates = [
        [approved && !!a.current, p.plan ? "Plan goedgekeurd" : "Plan gemaakt en goedgekeurd"],
        [approved && !!a.grade_current, "Grade goedgekeurd" + (g.look != null ? ` (${lookName(g.look)}, ${pct(g.strength)})` : "")],
        [online(), "Studio-sessie op je PC bereikbaar"],
      ];
      $("#gates", el).innerHTML = gates.map(([ok, t]) => `<li class="${ok ? "ok" : "wait"}"><i>${ok ? "✓" : "!"}</i>${esc(t)}</li>`).join("");
      $("#renderBtn", el).dataset.block = ready && !rendering ? "" : "1";
      $("#qaBtn", el).dataset.block = p.render ? "" : "1";
      $("#rwhy", el).textContent = !online() ? offlineReason()
        : rendering ? "Er draait al een render voor dit project op je PC. Wacht tot hij klaar is (zie Instellingen)."
        : !ready ? (a && a.current && !a.grade_current ? "grade gewijzigd: opnieuw goedkeuren" : "Renderen kan pas na je goedkeuring van dit plan en deze grade.")
        : "Rendert de volledige montage met de goedgekeurde grade. QA controleert daarna geluid en beeld.";
      $("#rwhy", el).className = "why" + (!online() || !ready || rendering ? " warn" : "");
      const rv = p.render && safeUrl(p.render.review_url);
      $("#rinfo", el).innerHTML = p.render ? (rv ? `<img class="mini-sheet" src="${esc(rv)}" alt="Reviewbeeld van de laatste render" style="margin-bottom:12px">` : "") +
        `<dl class="kv"><dt>Gerenderd</dt><dd>${esc(when(p.render.at) || "—")}</dd></dl>
        <p class="muted small" style="margin-bottom:0">Bekijk hem bij <a href="#/p/${enc(id)}/resultaat" style="color:var(--blue)">Resultaat</a>.</p>` : '<div class="muted">Nog niet gerenderd.</div>';
      pcButtons(el);
    },
  };
}

// ---------------------------------------------------------- tab: resultaat
function resultTab(el) {
  el.innerHTML = `<div id="res"></div>`;
  let key = null;
  return {
    update(p) {
      const r = p.render, review = r && safeUrl(r.review_url), prev = r && safeUrl(r.preview_url);
      const k = [review, prev, r && r.at].join("|");
      if (k === key) return;
      key = k;
      $("#res", el).innerHTML = !r ? '<div class="empty">Nog geen render. Render eerst bij Renderen.</div>'
        : `<div class="stack"><div class="muted small">Gerenderd ${esc(when(r.at))}</div>
          ${prev ? `<div class="card"><h2>Voorbeeldvideo</h2><video controls preload="metadata" playsinline src="${esc(prev)}"></video></div>`
            : '<div class="banner">Geen voorbeeldvideo (te groot om te uploaden). De volledige render staat op je PC.</div>'}
          ${review ? `<div class="card review"><h2>Review: een beeld per accent</h2><img src="${esc(review)}" alt="Reviewbeeld van de render"></div>` : ""}</div>`;
    },
  };
}

// JUICT submenu in the sidebar: fold open/closed, remembered in this browser; opens itself when you are in it
(function () {
  const btn = $("#juictFold"), sub = $("#juictSub");
  const set = (open) => { btn.setAttribute("aria-expanded", open); sub.hidden = !open; };
  set(store.get("juict-nav-open") !== false);
  btn.onclick = () => { const open = sub.hidden; set(open); store.set("juict-nav-open", open); };
  window.addEventListener("hashchange", () => { if (/^#\/(juict|prompt|instructies)/.test(location.hash) && sub.hidden) set(true); });
})();
render();
start();
</script>

</body></html>
