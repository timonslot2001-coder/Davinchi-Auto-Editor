# ============================================================
#  Technique inventory — eye candy (VFX) + ear candy (SFX)
#  Learned from your reference edits. The director picks from here per video:
#  only where it is MOTIVATED (music hit, movement, scene change), within a budget,
#  and every VFX gets the sound that belongs to it. Add new techniques here when you
#  send new references (Claude does this; see CLAUDE.md).
#
#  trigger:   when it makes sense
#     first_hit   – first big hit of the song        last_hit  – last big hit (final shot)
#     hit         – any strong musical impact        downbeat  – start of a bar
#     motion      – shot has strong camera/subject motion at the cut
#     quiet       – calm part of the song            intro     – first seconds
#     scene       – big visual change between two shots
#  max:       times per video            cooldown_s: minimum seconds before it may repeat
#  sfx:       sound category that goes with it (null = none); sfx_lead_s > 0: sound starts that much
#             BEFORE the visual (risers/swells), 0 = on the frame
#  priority:  higher wins when two techniques want the same moment
#  chance:    probability the technique is available at all in a video (1.0 = always, default)
#  avoid:     moments where it must NOT happen (e.g. intro = while the title is on screen)
# ============================================================

budget:
  accents_per_10s: 3.2        # total visual accents (not counting plain cuts)
  min_gap_s: 1.4              # never two accents closer than this (except a hit pair)
  sfx_per_10s: 4.0            # ear candy budget
  quiet_start_s: 0.0          # no accents before this (except the title)
  keep_last_shot_clean: false

techniques:

  whip:
    type: vfx
    desc: "camera-whip blur into the next shot"
    from: [LA reference, Shanghai vlog]
    trigger: [motion, hit]
    max: 2
    cooldown_s: 3.0
    sfx: whoosh
    sfx_lead_s: 0.12
    sfx_gain_db: -9
    priority: 6

  dip_to_black:
    type: vfx
    desc: "hard cut to black for a beat, then back on the downbeat"
    from: [LA reference]
    trigger: [downbeat, intro]
    max: 1
    cooldown_s: 99
    sfx: impact            # low hit when the picture comes back
    sfx_at: end
    sfx_gain_db: -12
    priority: 5

  light_leak:
    type: vfx
    desc: "orange film burn sweeping across, into the final hold"
    from: [LA reference]
    trigger: [last_hit]
    max: 1
    cooldown_s: 99
    sfx: swell
    sfx_lead_s: 0.6
    sfx_gain_db: -11
    priority: 9

  frame_in_frame:
    type: vfx
    desc: "shot shown as a 'photo' on a paper backdrop"
    from: [Shanghai vlog, Austria hike]
    trigger: [quiet, downbeat]
    avoid: [intro]              # review 2026-10-19: title on top of a small photo = cluttered
    max: 1
    cooldown_s: 99
    sfx: shutter
    sfx_lead_s: 0.0
    sfx_gain_db: -10
    priority: 4

  bw:
    type: vfx
    desc: "black & white accent shot"
    from: [Austria hike]
    trigger: [quiet]
    max: 1
    cooldown_s: 99
    sfx: film               # projector / film crackle from your FOUR Editors film SFX
    sfx_lead_s: 0.0
    sfx_gain_db: -16
    priority: 3

  punch_zoom:
    type: vfx
    desc: "small snap zoom-in on the kick"
    from: [fitness tests]
    trigger: [hit]
    max: 2
    cooldown_s: 4.0
    sfx: hit
    sfx_lead_s: 0.0
    sfx_gain_db: -12
    priority: 5

  white_flash:
    type: vfx
    desc: "short exposure flash on a hit"
    from: [Austria hike]
    trigger: [hit, scene]
    max: 1
    cooldown_s: 99
    sfx: shutter
    sfx_lead_s: 0.0
    sfx_gain_db: -12
    priority: 4

  glitch:
    type: vfx
    desc: "2-3 frame RGB/invert glitch"
    from: [Austria hike]
    trigger: [hit]
    max: 1
    cooldown_s: 99
    sfx: glitch
    sfx_lead_s: 0.0
    sfx_gain_db: -14
    priority: 2

  speed_ramp:
    type: vfx
    desc: "slow down at the peak of a movement"
    from: [general]
    trigger: [motion]
    max: 1
    cooldown_s: 99
    sfx: riser
    sfx_lead_s: 0.9
    sfx_gain_db: -14
    priority: 5
    chance: 0.35                 # taste: slow-mo is nice sometimes, not needed every video

  title:
    type: text
    desc: "small spaced title (+ corner labels) over the intro"
    from: [LA reference, Shanghai vlog]
    trigger: [intro]
    max: 1
    sfx: click
    sfx_lead_s: 0.0
    sfx_gain_db: -16
    priority: 10

  # ---------------- learned 2026-10-19 from 17 references (city/travel/food/vlog edits) ----------------
  color_wipe:
    type: vfx
    desc: "solid colour block sweeping across a cut"
    from: [Buenos Aires, New York]
    trigger: [scene, hit]
    avoid: [intro]
    max: 1
    cooldown_s: 99
    sfx: whoosh
    sfx_lead_s: 0.1
    sfx_gain_db: -11
    priority: 5
    chance: 0.6

  step_zoom:
    type: vfx
    desc: "zoom toward a detail in 3 hard steps on the beat"
    from: [Buenos Aires 'Subte' sign]
    trigger: [long]
    avoid: [intro]
    max: 1
    cooldown_s: 99
    sfx: click                  # one click per step
    sfx_per_step: true
    sfx_gain_db: -14
    priority: 5
    chance: 0.6

  bw_flash:
    type: vfx
    desc: "2-3 frames of black & white on a hit"
    from: [Oran, Huaraz]
    trigger: [hit]
    max: 1
    cooldown_s: 99
    sfx: impact
    sfx_lead_s: 0.0
    sfx_gain_db: -15
    priority: 4
    chance: 0.6

  photo_series:
    type: series
    desc: "3 shots in a row shown as 'photos' on paper, on the beat"
    from: [Marrakech, Shenzhen, Shanghai]
    length: 3
    avoid: [intro]
    sfx: shutter                # one shutter per photo
    sfx_gain_db: -13
    chance: 0.35

  title_styles:
    type: text
    desc: "how the title appears — picked per video"
    from: [LA, Shanghai, Huaraz, OBSESSED, Kuala Lumpur, Buenos Aires, 'YOU READY?']
    options:                    # weights
      minimal: 0.40             # small spaced title (LA / Shanghai)
      big: 0.25                 # big condensed title over the image (Kuala Lumpur, Buenos Aires)
      card_flash: 0.20          # full-frame colour cards flashing on the beat (Huaraz, OBSESSED)
      kinetic: 0.15             # one word per beat (YOU · READY?) — only titles with 2+ words
    card_colors: [["#F3E9DC", "#D7261E"], ["#D7261E", "#F3E9DC"]]   # [text, background], alternating
    big_color: "#D7261E"
    sfx_card: hit
    sfx_word: click
    bookend_chance: 0.35        # title comes back over the final hold (Kuala Lumpur)

  # ---------------- real overlays from your FOUR Editors packs (2026-10-19) ----------------
  # type: overlay → a pack file placed on a track above the picture with a blend mode.
  # place: cut = centred on the cut (transition)   shot = over the whole shot   video = whole edit
  leak_transition:
    type: overlay
    desc: "real light leak / film burn over a cut"
    categories: [Lens Flares and Light Leaks, Film Burn, Analog Light, Vintage Film Leaks, Wipe and Light, Afterglow, Film Burns]
    place: cut
    blend: screen
    opacity: 75                 # review 2026-10-19: 90 washed the picture out to white
    trigger: [hit, scene]
    avoid: [intro]
    max: 1
    cooldown_s: 99
    sfx: swell
    sfx_lead_s: 0.4
    sfx_gain_db: -12
    priority: 6
    chance: 0.7

  glitch_transition:
    type: overlay
    desc: "real glitch / chromatic / retro distortion over a cut"
    categories: [Glitch, Retro Distortion, Chromatic Rush, Cyber Strokes]
    place: cut
    blend: screen
    opacity: 85
    trigger: [hit]
    max: 1
    cooldown_s: 99
    sfx: glitch
    sfx_gain_db: -14
    priority: 4
    chance: 0.45

  doodle:
    type: overlay
    desc: "hand-drawn scribble / lightning stroke over a shot (ref: lightning bolt)"
    categories: [Doodle Scratches, Lightning Details, Celluloid Neon Paint]
    place: shot
    blend: screen
    opacity: 90
    trigger: [hit, scene]
    avoid: [intro]
    max: 1
    cooldown_s: 99
    sfx: whoosh
    sfx_gain_db: -15
    priority: 4
    chance: 0.45

  ink_splash:
    type: overlay
    desc: "liquid ink splash on a hit"
    categories: [Flux Liquid]
    place: cut
    blend: screen
    opacity: 85
    trigger: [hit]
    avoid: [intro]
    max: 1
    cooldown_s: 99
    sfx: impact
    sfx_gain_db: -15
    priority: 3
    chance: 0.35

  viewfinder:
    type: overlay
    desc: "camera viewfinder / REC frame over one shot"
    categories: [Modern X (CRT Viewfinders), CRT Plates]
    place: shot
    blend: screen
    opacity: 70
    trigger: [scene]
    avoid: [intro]
    max: 1
    cooldown_s: 99
    sfx: click
    sfx_gain_db: -16
    priority: 2
    chance: 0.25

  film_texture:
    type: ambient
    desc: "subtle 16mm grain over the whole video"
    categories: [Film Grain 16mm, Grains]
    place: video
    blend: overlay
    opacity: 22
    chance: 0.5

  # the final light leak uses a real pack file when available (instead of the generated one)
  final_leak_from_pack:
    type: setting
    categories: [Lens Flares and Light Leaks, Film Burn, Analog Light]

# Seen in references but needs subject masking first (future work):
future:
  - "white silhouette flash of the subject (VLOG 002, Frankfurt, OBSESSED)"
  - "big text behind the subject (Austria, Zalijak, VLOG 002)"
  - "3 vertical strips with different shots sliding in (London)"
  - "hand-drawn doodle / scribble overlays (lightning bolt)"
  - "match cut / cut on action between clips with the same movement (crème brûlée, Alex Warren)"
